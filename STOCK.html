<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>СТОК</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 1400px;
      margin: 40px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
      font-size: 14px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #444;
      text-align: center;
    }

    th {
      background: #fff;
      color: #000;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>СТОК</h1>

  <table>
    <thead>
      <tr>
        <th>КАТЕГОРИЯ</th>
        <th>ПРИХОД</th>
        <th>ЦЕНА ЗАКУПА</th>
        <th>СУММА ПРИХОДА</th>
        <th>ПРОДАНО</th>
        <th>ЦЕНА ПРОДАЖИ</th>
        <th>ФАКТ. ЦЕНА ПРОДАЖИ</th>
        <th>СУММА ПРОДАЖ</th>
        <th>ОСТАТОК</th>
        <th>СУММА ОСТАТКА</th>
        <th>ДОХОД</th>
      </tr>
    </thead>

    <tbody id="stockData">
    </tbody>
  </table>

  <button onclick="window.location.href='HOME.html'">
    ОБРАТНО
  </button>

</div>
<script>
function loadStock(data) {

  const table = document.getElementById('stockData');
  table.innerHTML = '';
let totalIncoming = 0;
let totalIncomingAmount = 0;
let totalSold = 0;
let totalSalesAmount = 0;
let totalRemaining = 0;
let totalRemainingAmount = 0;
let totalProfit = 0;
  data.forEach(item => {

    const row = document.createElement('tr');

 row.innerHTML = `
  <td>${item.category}</td>
  <td>${item.incoming}</td>
  <td>${Number(item.purchasePrice).toFixed(2)}</td>
  <td>${Number(item.incomingAmount).toFixed(2)}</td>
  <td>${item.sold}</td>
  <td>${Number(item.salePrice).toFixed(2)}</td>
  <td>${item.sold > 0 ? (Number(item.salesAmount) / Number(item.sold)).toFixed(2) : '0.00'}</td>
  <td>${Number(item.salesAmount).toFixed(2)}</td>
  <td>${item.remaining}</td>
  <td>${Number(item.remainingAmount).toFixed(2)}</td>
  <td>${Number(item.profit).toFixed(2)}</td>
`;

    table.appendChild(row);
    totalIncoming += Number(item.incoming);
totalIncomingAmount += Number(item.incomingAmount);
totalSold += Number(item.sold);
totalSalesAmount += Number(item.salesAmount);
totalRemaining += Number(item.remaining);
totalRemainingAmount += Number(item.remainingAmount);
totalProfit += Number(item.profit);
  });
 const totalRow = document.createElement('tr');
totalRow.style.backgroundColor = '#ffffff';
totalRow.style.color = '#000000';
totalRow.innerHTML = `
    <td><strong>ИТОГО</strong></td>
    <td><strong>${totalIncoming}</strong></td>
    <td>—</td>
    <td><strong>${totalIncomingAmount.toFixed(2)}</strong></td>
    <td><strong>${totalSold}</strong></td>
    <td>—</td>
    <td>—</td>
    <td><strong>${totalSalesAmount.toFixed(2)}</strong></td>
    <td><strong>${totalRemaining}</strong></td>
    <td><strong>${totalRemainingAmount.toFixed(2)}</strong></td>
    <td><strong>${totalProfit.toFixed(2)}</strong></td>
  `;

  table.appendChild(totalRow);
}

const script = document.createElement('script');

script.src =
  'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec?action=stock&callback=loadStock';

document.body.appendChild(script);
</script>
</body>
</html>
