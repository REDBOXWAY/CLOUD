<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CLOUD DRIVE</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .home {
      text-align: center;
      width: 90%;
      max-width: 500px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 40px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #FFC000;
      color: black;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>

<body>

  <div class="home">

    <h1>CLOUD DRIVE</h1>

    <p>Добро пожаловать</p>

    <button onclick="showLogin()">
  ЗАПОЛНИТЬ ФОРМУ
</button>
<br><br>

<button onclick="window.location.href='ANALYTICS.html'">
  АНАЛИТИКА ПРОДАЖ
</button>
<br><br>

<button onclick="window.location.href='STOCK.html'">
  СТОК
</button>
<div id="loginBox" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
">

  <div style="
    background:#111;
    padding:30px;
    border-radius:12px;
    width:90%;
    max-width:320px;
    text-align:center;
    <div style="
  background:#111;
  padding:30px;
  border-radius:12px;
  width:90%;
  max-width:320px;
  text-align:center;
  position:relative;
">
  ">

  <button onclick="closeLogin()" style="
  position:absolute;
  top:10px;
  right:15px;
  width:auto;
  background:none;
  color:white;
  font-size:14px;
  font-weight:bold;
  padding:5px;
  margin:0;
">
  CLOSE
</button> <h2>ВХОД</h2>

    <input id="login" placeholder="Логин" style="
      width:100%;
      padding:12px;
      margin-bottom:12px;
      box-sizing:border-box;
    ">

    <input id="password" type="password" placeholder="Пароль" style="
      width:100%;
      padding:12px;
      margin-bottom:15px;
      box-sizing:border-box;
    ">

    <button onclick="loginUser()">ВОЙТИ</button>

    <div id="loginMessage" style="
      margin-top:12px;
      color:#ff6b6b;
    "></div>

  </div>
</div>

<script>
function showLogin() {
  document.getElementById('loginBox').style.display = 'flex';
}

function loginUser() {

  const login = document.getElementById('login').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('loginMessage');

  msg.textContent = 'Проверка...';

  fetch('https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec',  {
    method: 'POST',
    body: new URLSearchParams({
      action: 'login',
      login: login,
      password: password
    })
  })
  .then(response => response.text())
  .then(result => {

    if (result === 'LOGIN_OK') {
      window.location.href = 'INDEX.html';
    } else {
      msg.textContent = 'Неверный логин или пароль';
    }

  })
  .catch(() => {
    msg.textContent = 'Ошибка соединения';
  });
}
</script>
</body>
</html>
