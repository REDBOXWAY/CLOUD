<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .home {
      text-align: center;
      width: 90%;
      max-width: 500px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 40px;
    }

    button {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: white;
      color: black;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>

<body>

  <div class="home">

    <h1>CLOUD DRIVE</h1>

    <p>Добро пожаловать</p>

   <button onclick="openForm()">
  ЗАПОЛНИТЬ ФОРМУ
</button>

<script>
function openForm() {
  google.script.run
    .withSuccessHandler(function(html) {
      document.open();
      document.write(html);
      document.close();
    })
    .openForm();
}
</script>

  </div>

</body>
</html>
