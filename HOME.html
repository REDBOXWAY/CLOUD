<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLOUD DRIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .home {
      width: min(1100px, 92vw);
      padding: 48px 0 72px;
      text-align: center;
    }

    h1 {
      margin: 0 0 100px;
      font-size: clamp(52px, 6vw, 82px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(24px, 4vw, 64px);
      align-items: start;
    }

    .menu-item {
      display: block;
      color: #fff;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .menu-item:hover,
    .menu-item:focus-visible {
      transform: translateY(-7px);
      filter: brightness(1.12);
      outline: none;
    }

    .menu-title {
      display: block;
      margin-bottom: 18px;
      font-size: clamp(22px, 2.2vw, 32px);
      line-height: 1;
      font-weight: 800;
      text-align: center;
    }

    .menu-icon {
      display: block;
      width: 100%;
      max-width: 190px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }

    .icon-stroke {
      fill: none;
      stroke: url(#iconGradient);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 760px) {
      body {
        align-items: flex-start;
      }

      .home {
        width: min(620px, 90vw);
        padding: 64px 0;
      }

      h1 {
        margin-bottom: 68px;
        font-size: clamp(42px, 12vw, 64px);
      }

      .menu {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 52px 26px;
      }

      .menu-title {
        font-size: clamp(19px, 5vw, 27px);
      }

      .menu-icon {
        max-width: 165px;
      }
    }

    @media (max-width: 390px) {
      .home {
        width: 88vw;
      }

      h1 {
        margin-bottom: 58px;
        font-size: 38px;
      }

      .menu {
        gap: 42px 16px;
      }

      .menu-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="home">

    <h1>CLOUD DRIVE</h1>

    <nav class="menu">

      <!-- REGISTRY -->
      <a class="menu-item" href="INDEX.html">
        <span class="menu-title">REGISTRY</span>

        <svg class="menu-icon" viewBox="0 0 180 180">
          <defs>
            <linearGradient id="iconGradient" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#ff7827"/>
              <stop offset="1" stop-color="#ffd633"/>
            </linearGradient>
          </defs>

          <path class="icon-stroke"
                d="M40 20h62l27 27v91H40z"/>

          <path class="icon-stroke"
                d="M102 20v28h27
                   M59 65h22
                   m15 0h1
                   m14 0h1
                   M59 89h50
                   M59 113h42"/>

          <circle class="icon-stroke"
                  cx="126"
                  cy="130"
                  r="36"/>

          <path class="icon-stroke"
                d="M126 113v34
                   m-17-17h34"/>
        </svg>
      </a>

      <!-- ANALYTICS -->
      <a class="menu-item" href="ANALYTICS.html">
        <span class="menu-title">ANALYTICS</span>

        <svg class="menu-icon" viewBox="0 0 180 180">
          <path class="icon-stroke"
                d="M27 147v-37h28v37z
                   m49 0V88h28v59z
                   m49 0V58h28v89z"/>

          <path class="icon-stroke"
                d="m29 86 39-39 25 25 52-52
                   m-21 0h21v21"/>
        </svg>
      </a>

      <!-- STOCK -->
      <a class="menu-item" href="STOCK.html">
        <span class="menu-title">STOCK</span>

        <svg class="menu-icon" viewBox="0 0 180 180">
          <path class="icon-stroke"
                d="m31 54 58-30 59 30-59 31z
                   M31 54v70l58 31 21-11
                   m38-90v43
                   M60 39l59 31"/>

          <circle class="icon-stroke"
                  cx="132"
                  cy="128"
                  r="35"/>

          <path class="icon-stroke"
                d="m114 128 12 12 24-27"/>
        </svg>
      </a>

      <!-- RETURNS -->
      <a class="menu-item" href="RETURN.html">
        <span class="menu-title">RETURNS</span>

        <svg class="menu-icon" viewBox="0 0 180 180">
          <path class="icon-stroke"
                d="M35 62A61 61 0 0 1 145 76
                   V57
                   m0 19h-19
                   M145 118A61 61 0 0 1 35 104
                   v19
                   m0-19h19"/>

          <path class="icon-stroke"
                d="m63 76 27-15 27 15-27 15z
                   M63 76v34l27 15 27-15V76
                   M90 91v34"/>
        </svg>
      </a>

    </nav>

  </main>

</body>
</html>
