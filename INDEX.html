<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CLOUD DRIVE — REGISTRY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: "Bebas Neue", sans-serif;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    button,
    input,
    textarea,
    select,
    option {
      font-family: "Bebas Neue", sans-serif;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .page {
      width: 92%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .header {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .header-right {
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 50px;
      font-weight: 400;
      line-height: 1;
    }

    .date-input {
      width: 168px;
      height: 44px;
      border: 1px solid #fff;
      border-radius: 7px;
      text-align: center;
      font-size: 20px;
      background: #fff;
      color: #000;
    }

    .date-label {
      margin-top: 8px;
      font-size: 19px;
    }

    .barcode-label {
      margin-bottom: 8px;
      font-size: 19px;
    }

    .barcode-row,
    .result-row {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) 160px;
      gap: 18px;
      max-width: 640px;
      margin-bottom: 18px;
    }

    #barcode {
      width: 100%;
      height: 46px;
      border: 1px solid #fff;
      border-radius: 7px;
      text-align: center;
      font-size: 21px;
      outline: none;
      background: #fff;
      color: #000;
    }

    .small-button,
    .bottom-button {
      height: 46px;
      border: 1px solid #ffc000;
      border-radius: 7px;
      background: #ffc000;
      color: #000;
      cursor: pointer;
      font-size: 20px;
      font-weight: 400;
    }

    .small-button:hover,
    .bottom-button:hover {
      filter: brightness(0.95);
    }

    .small-button:disabled,
    .bottom-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-actions .small-button {
      flex: 1;
    }

    .clear-search-button {
      display: flex;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      background: transparent;
      color: #8fd14f;
      cursor: pointer;
    }

    .clear-search-button svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .clear-search-button:hover {
      filter: brightness(1.18);
    }

    #productInfo {
      min-height: 46px;
      border: 1px solid #fff;
      border-radius: 7px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      background: #fff;
      color: #000;
      overflow-wrap: anywhere;
    }

    #addToListBtn {
      display: none;
    }

    .purchase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 5px 10px;
      font-weight: 400;
      font-size: 20px;
    }

    #purchaseList {
      display: none;
      width: 100%;
      min-height: 245px;
      border: 1px solid #fff;
      padding: 16px 18px;
      background: #000;
      color: #fff;
    }

    .purchase-item {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 170px 150px;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }

    .purchase-description {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .amount-input {
      width: 100%;
      height: 46px;
      border: 1px solid #fff;
      border-radius: 7px;
      padding: 0 12px;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      background: #fff;
      color: #000;
    }

    .remove-button {
      height: 46px;
      border: 1px solid #fff;
      border-radius: 7px;
      background: red;
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      font-weight: 400;
    }

    .bottom-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    #message {
      display: none;
      width: 500px;
      max-width: 100%;
      margin: 30px auto 0;
      padding: 11px 15px;
      text-align: center;
      font-size: 21px;
      font-weight: 400;
    }

    .success {
      display: block !important;
      background: transparent;
      color: #8fd14f;
      border: none !important;
      padding: 0 !important;
    }

    .error {
      display: block !important;
      background: transparent;
      color: red;
      border: none !important;
      padding: 0 !important;
    }

    @media (max-width: 700px) {

      .page {
        width: 94%;
        padding-top: 18px;
      }

      .header {
        justify-content: center;
      }

      h1 {
        font-size: 44px;
      }

      .barcode-row,
      .result-row,
      .purchase-item,
      .bottom-buttons {
        grid-template-columns: 1fr;
      }

      .barcode-row,
      .result-row {
        gap: 10px;
        max-width: none;
      }

      .purchase-item {
        gap: 10px;
      }

      .bottom-buttons {
        gap: 10px;
      }

      #purchaseList {
        min-height: 180px;
      }

      .purchase-header {
        font-size: 19px;
      }

      .small-button,
      .bottom-button,
      .remove-button {
        font-size: 20px;
      }

    }

  </style>
</head>

<body>

  <div class="page">

    <div class="header">

      <div class="header-right">

        <h1>CLOUD DRIVE</h1>

        <input
          id="date"
          class="date-input"
          type="date"
          required
        >

        <div class="date-label">
          SET THE DATE
        </div>

      </div>

    </div>


    <form id="form">

      <div class="barcode-label">
        ENTER BARCODE
      </div>


      <div class="barcode-row">

        <input
          id="barcode"
          type="text"
          inputmode="numeric"
          autocomplete="off"
        >


        <div class="search-actions">

          <button
            id="searchBtn"
            type="button"
            class="small-button"
          >
            SEARCH
          </button>


          <button
            id="clearSearchBtn"
            class="clear-search-button"
            type="button"
            aria-label="Clear search message"
          >

            <svg viewBox="0 0 24 24">

              <path d="M20 7V3l-2 2a8 8 0 0 0-13 3"/>

              <path d="M4 17v4l2-2a8 8 0 0 0 13-3"/>

              <path d="M20 3h-4M4 21h4"/>

            </svg>

          </button>

        </div>

      </div>


      <div class="result-row">

        <div id="productInfo"></div>

        <button
          id="addToListBtn"
          type="button"
          class="small-button"
        >
          ADD TO LIST
        </button>

      </div>


      <div class="purchase-header">

        <span>
          PURCHASE LIST
        </span>

        <span id="totalAmount">
          TOTAL: 0.00 ₼
        </span>

      </div>


      <div id="purchaseList">

        <div id="purchaseItems"></div>

      </div>


      <div class="bottom-buttons">

        <button
          id="submitBtn"
          type="submit"
          class="bottom-button"
        >
          SEND
        </button>


        <button
          type="button"
          class="bottom-button"
          onclick="goHome()"
        >
          BACK
        </button>

      </div>


      <div id="message"></div>

    </form>

  </div>


  <script>

    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec';


    let currentProduct = null;

    let purchaseList = [];


    const dateInput =
      document.getElementById('date');

    const barcodeInput =
      document.getElementById('barcode');

    const searchBtn =
      document.getElementById('searchBtn');

    const clearSearchBtn =
      document.getElementById('clearSearchBtn');

    const addToListBtn =
      document.getElementById('addToListBtn');

    const productInfo =
      document.getElementById('productInfo');

    const message =
      document.getElementById('message');



    function loadProduct(data) {

      searchBtn.disabled = false;

      searchBtn.textContent =
        'SEARCH';


      if (!data) {

        currentProduct = null;

        productInfo.style.display =
          'flex';

        productInfo.style.background =
          'transparent';

        productInfo.style.color =
          'red';

        productInfo.style.border =
          'none';

        productInfo.style.fontWeight =
          '400';

        productInfo.textContent =
          'BARCODE NOT FOUND';

        addToListBtn.style.display =
          'none';

        return;

      }


      currentProduct = data;

      productInfo.style.display =
        'flex';

      productInfo.style.background =
        '#fff';

      productInfo.style.color =
        '#000';

      productInfo.style.border =
        '1px solid #fff';

      productInfo.style.fontWeight =
        '400';

      productInfo.textContent =
        data.article;

      addToListBtn.style.display =
        'block';

    }



    function barcodeLookupError() {

      searchBtn.disabled = false;

      searchBtn.textContent =
        'SEARCH';

      currentProduct = null;

      productInfo.style.display =
        'flex';

      productInfo.style.background =
        'transparent';

      productInfo.style.color =
        'red';

      productInfo.style.border =
        'none';

      productInfo.style.fontWeight =
        '400';

      productInfo.textContent =
        'CONNECTION ERROR';

      addToListBtn.style.display =
        'none';

    }



    function searchBarcode() {

      const barcode =
        barcodeInput.value.trim();


      if (!barcode) {
        return;
      }


      currentProduct = null;

      addToListBtn.style.display =
        'none';


      productInfo.style.display =
        'flex';

      productInfo.style.background =
        'transparent';

      productInfo.style.color =
        '#8fd14f';

      productInfo.style.border =
        'none';

      productInfo.style.fontWeight =
        '400';

      productInfo.textContent =
        'SEARCHING...';


      searchBtn.disabled =
        true;

      searchBtn.textContent =
        'SEARCHING...';


      const oldScript =
        document.getElementById(
          'barcodeLookup'
        );


      if (oldScript) {
        oldScript.remove();
      }


      const script =
        document.createElement(
          'script'
        );


      script.id =
        'barcodeLookup';


      script.onerror =
        barcodeLookupError;


      script.src =
        BACKEND_URL +

        '?action=product&barcode=' +

        encodeURIComponent(
          barcode
        ) +

        '&callback=loadProduct&_=' +

        Date.now();


      document.body.appendChild(
        script
      );

    }



    function addToList() {

      if (!currentProduct) {
        return;
      }


      const barcode =
        String(
          currentProduct.barcode
        ).trim();


      const existing =
        purchaseList.find(
          item =>
            item.barcode === barcode
        );


      if (existing) {

        existing.quantity += 1;

      } else {

        purchaseList.push({

          barcode:
            barcode,

          article:
            currentProduct.article,

          product:
            currentProduct.product,

          quantity:
            1,

          amount:
            ''

        });

      }


      renderPurchaseList();


      barcodeInput.value =
        '';


      productInfo.style.display =
        'none';


      addToListBtn.style.display =
        'none';


      currentProduct =
        null;


      barcodeInput.focus();

    }



    function renderPurchaseList() {

      const box =
        document.getElementById(
          'purchaseList'
        );

      const items =
        document.getElementById(
          'purchaseItems'
        );


      box.style.display =
        purchaseList.length
          ? 'block'
          : 'none';


      items.innerHTML =
        '';


      purchaseList.forEach(
        (item, index) => {


          const row =
            document.createElement(
              'div'
            );


          row.className =
            'purchase-item';



          const description =
            document.createElement(
              'div'
            );


          description.className =
            'purchase-description';


          description.textContent =
            item.article +
            ' × ' +
            item.quantity;



          const amount =
            document.createElement(
              'input'
            );


          amount.type =
            'number';


          amount.step =
            '0.01';


          amount.min =
            '0';


          amount.placeholder =
            'ENTER AMOUNT';


          amount.className =
            'amount-input';


          amount.value =
            item.amount;


          amount.addEventListener(
            'input',
            function () {

              purchaseList[index].amount =
                this.value;

              updateTotal();

            }
          );



          const remove =
            document.createElement(
              'button'
            );


          remove.type =
            'button';


          remove.className =
            'remove-button';


          remove.textContent =
            'REMOVE';


          remove.addEventListener(
            'click',
            function () {

              purchaseList.splice(
                index,
                1
              );

              renderPurchaseList();

            }
          );


          row.appendChild(
            description
          );

          row.appendChild(
            amount
          );

          row.appendChild(
            remove
          );

          items.appendChild(
            row
          );

        }
      );


      updateTotal();

    }



    function updateTotal() {

      const total =
        purchaseList.reduce(

          (sum, item) =>
            sum +
            (
              Number(item.amount)
              || 0
            ),

          0

        );


      document.getElementById(
        'totalAmount'
      ).textContent =

        'TOTAL: ' +
        total.toFixed(2) +
        ' ₼';

    }



    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        type;

    }



    const today =
      new Date();


    dateInput.value =
      new Date(

        today.getTime() -

        today.getTimezoneOffset()
        * 60000

      )
      .toISOString()
      .split('T')[0];



    searchBtn.addEventListener(
      'click',
      searchBarcode
    );



    clearSearchBtn.addEventListener(
      'click',
      function () {

        currentProduct =
          null;


        productInfo.textContent =
          '';


        productInfo.style.display =
          'none';


        addToListBtn.style.display =
          'none';


        barcodeInput.value =
          '';


        searchBtn.disabled =
          false;


        searchBtn.textContent =
          'SEARCH';


        barcodeInput.focus();

      }
    );



    addToListBtn.addEventListener(
      'click',
      addToList
    );



    barcodeInput.addEventListener(
      'keydown',
      function (event) {

        if (event.key === 'Enter') {

          event.preventDefault();

          searchBarcode();

        }

      }
    );



    document
      .getElementById('form')
      .addEventListener(
        'submit',
        function (event) {


          event.preventDefault();


          const submitBtn =
            document.getElementById(
              'submitBtn'
            );


          if (!dateInput.value) {

            showMessage(
              'SET THE DATE',
              'error'
            );

            return;

          }


          if (!purchaseList.length) {

            showMessage(
              'PURCHASE LIST EMPTY',
              'error'
            );

            return;

          }


          const invalidAmount =
            purchaseList.some(

              item =>
                item.amount === '' ||

                !Number.isFinite(
                  Number(item.amount)
                ) ||

                Number(item.amount)
                <= 0

            );


          if (invalidAmount) {

            showMessage(
              'ENTER AMOUNT FOR ALL PRODUCTS',
              'error'
            );

            return;

          }


          submitBtn.disabled =
            true;


          submitBtn.textContent =
            'SENDING...';


          message.style.display =
            'none';


          message.className =
            '';


          const itemsToSend =
            purchaseList.map(
              item => ({

                barcode:
                  item.barcode,

                article:
                  item.article,

                quantity:
                  item.quantity,

                amount:
                  Number(item.amount)

              })
            );


          fetch(
            BACKEND_URL,
            {

              method:
                'POST',

              body:
                new URLSearchParams({

                  action:
                    'purchaseList',

                  date:
                    dateInput.value,

                  items:
                    JSON.stringify(
                      itemsToSend
                    )

                })

            }
          )


          .then(
            response =>
              response.text()
          )


          .then(
            result => {


              if (
                result.trim()
                !== 'OK'
              ) {

                throw new Error(
                  result
                );

              }


              showMessage(
                'ALL DATA SENT SUCCESSFULLY!',
                'success'
              );


              purchaseList =
                [];


              currentProduct =
                null;


              renderPurchaseList();


              productInfo.style.display =
                'none';


              addToListBtn.style.display =
                'none';


              barcodeInput.value =
                '';


              barcodeInput.focus();

            }
          )


          .catch(
            error => {

              showMessage(
                'ERROR: ' +
                error.message,
                'error'
              );

            }
          )


          .finally(
            () => {

              submitBtn.disabled =
                false;


              submitBtn.textContent =
                'SEND';

            }
          );

        }
      );



    function goHome() {

      window.location.href =
        'HOME.html';

    }

  </script>

</body>
</html>
