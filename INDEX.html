<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CLOUD DRIVE — REGISTRY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: "Arial Nova Cond", "Arial Narrow", Arial, sans-serif;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .page {
      width: 92%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .header {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .header-right {
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 36px;
      font-weight: 700;
    }

    .date-input {
      width: 150px;
      height: 38px;
      border: 1px solid #ffc000;
      border-radius: 7px;
      text-align: center;
      font-size: 14px;
      background: #fff;
      color: #000;
    }

    .date-label {
      margin-top: 7px;
      font-size: 13px;
    }

    .barcode-label {
      margin-bottom: 6px;
      font-size: 13px;
    }

    .barcode-row,
    .result-row {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) 150px;
      gap: 18px;
      max-width: 570px;
      margin-bottom: 16px;
    }

    #barcode {
      width: 100%;
      height: 38px;
      border: 1px solid #ffc000;
      border-radius: 7px;
      text-align: center;
      font-size: 14px;
      outline: none;
      background: #fff;
      color: #000;
    }

    .small-button,
    .bottom-button {
      height: 38px;
      border: 1px solid #ffc000;
      border-radius: 7px;
      background: #ffc000;
      color: #000;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .small-button:hover,
    .bottom-button:hover {
      filter: brightness(0.95);
    }

    .small-button:disabled,
    .bottom-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    #productInfo {
      min-height: 38px;
      border: 1px solid #ffc000;
      border-radius: 7px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      text-align: center;
      font-size: 13px;
      background: #fff;
      color: #000;
      overflow-wrap: anywhere;
    }

    #addToListBtn {
      display: none;
    }

    .purchase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 5px 7px;
      font-weight: 700;
      font-size: 13px;
    }

    #purchaseList {
      display: none;
      width: 100%;
      min-height: 245px;
      border: 1px solid #ffc000;
      padding: 14px 16px;
      background: #000;
      color: #fff;
    }

    .purchase-item {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 150px 150px;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .purchase-description {
      font-size: 13px;
      color: #fff;
      overflow-wrap: anywhere;
    }

    .amount-input {
      width: 100%;
      height: 38px;
      border: 1px solid #ffc000;
      border-radius: 7px;
      padding: 0 12px;
      text-align: center;
      font-size: 13px;
      background: #fff;
      color: #000;
    }

    .remove-button {
      height: 38px;
      border: 1px solid red;
      border-radius: 7px;
      background: red;
      color: #000;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .bottom-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 16px;
    }

    #message {
      display: none;
      width: 400px;
      max-width: 100%;
      margin: 30px auto 0;
      padding: 11px 15px;
      border: 1px solid #ffc000;
      border-radius: 7px;
      text-align: center;
      font-size: 13px;
    }
.success {
  display: block !important;
  background: transparent;
  color: #8fd14f;
  font-weight: 700;
  border: none !important;
  padding: 0 !important;
}


   .error {
  display: block !important;
  background: transparent;
  color: red;
  font-weight: 700;
  border: none !important;
  padding: 0 !important;
}

    @media (max-width: 700px) {
      .page {
        width: 94%;
        padding-top: 18px;
      }

      .header {
        justify-content: center;
      }

      h1 {
        font-size: 28px;
      }

      .barcode-row,
      .result-row,
      .purchase-item,
      .bottom-buttons {
        grid-template-columns: 1fr;
      }

      .barcode-row,
      .result-row {
        gap: 8px;
        max-width: none;
      }

      .purchase-item {
        gap: 8px;
      }

      .bottom-buttons {
        gap: 10px;
      }

      #purchaseList {
        min-height: 180px;
      }

      .purchase-header {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      <div class="header-right">

        <h1>CLOUD DRIVE</h1>

        <input
          id="date"
          class="date-input"
          type="date"
          required
        >

        <div class="date-label">
          SET THE DATE
        </div>

      </div>
    </div>

    <form id="form">

      <div class="barcode-label">
        ENTER BARCODE
      </div>

      <div class="barcode-row">

        <input
          id="barcode"
          type="text"
          inputmode="numeric"
          autocomplete="off"
        >

        <button
          id="searchBtn"
          type="button"
          class="small-button"
        >
          SEARCH BARCODE
        </button>

      </div>

      <div class="result-row">

        <div id="productInfo"></div>

        <button
          id="addToListBtn"
          type="button"
          class="small-button"
        >
          ADD TO LIST
        </button>

      </div>

      <div class="purchase-header">

        <span>PURCHASE LIST</span>

        <span id="totalAmount">
          TOTAL: 0.00 ₼
        </span>

      </div>

      <div id="purchaseList">
        <div id="purchaseItems"></div>
      </div>

      <div class="bottom-buttons">

        <button
          id="submitBtn"
          type="submit"
          class="bottom-button"
        >
          SEND
        </button>

        <button
          type="button"
          class="bottom-button"
          onclick="goHome()"
        >
          BACK
        </button>

      </div>

      <div id="message"></div>

    </form>

  </div>

  <script>
    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec';

    let currentProduct = null;
    let purchaseList = [];

    const dateInput =
      document.getElementById('date');

    const barcodeInput =
      document.getElementById('barcode');

    const searchBtn =
      document.getElementById('searchBtn');

    const addToListBtn =
      document.getElementById('addToListBtn');

    const productInfo =
      document.getElementById('productInfo');

    const message =
      document.getElementById('message');


    function loadProduct(data) {
      searchBtn.disabled = false;
      searchBtn.textContent = 'SEARCH BARCODE';

      if (!data) {
        currentProduct = null;

        productInfo.style.display = 'flex';
        productInfo.style.background = 'red';
        productInfo.style.borderColor = '#000';
        productInfo.textContent = 'BARCODE NOT FOUND';

        addToListBtn.style.display = 'none';

        return;
      }

      currentProduct = data;

      productInfo.style.display = 'flex';
      productInfo.style.background = '#fff';
      productInfo.style.color = '#000';
      productInfo.style.borderColor = '#ffc000';
      productInfo.textContent = data.article;

      addToListBtn.style.display = 'block';
    }


    function barcodeLookupError() {
      searchBtn.disabled = false;
      searchBtn.textContent = 'SEARCH BARCODE';

      currentProduct = null;

      productInfo.style.display = 'flex';
      productInfo.style.background = 'red';
      productInfo.style.color = '#000';
      productInfo.style.borderColor = '#000';
      productInfo.textContent = 'CONNECTION ERROR';

      addToListBtn.style.display = 'none';
    }


    function searchBarcode() {
      const barcode =
        barcodeInput.value.trim();

      if (!barcode) {
        return;
      }

      currentProduct = null;

      addToListBtn.style.display = 'none';

      productInfo.style.display = 'flex';
      productInfo.style.background = '#fff';
      productInfo.style.color = '#000';
      productInfo.textContent = 'SEARCHING...';

      searchBtn.disabled = true;
      searchBtn.textContent = 'SEARCHING...';

      const oldScript =
        document.getElementById('barcodeLookup');

      if (oldScript) {
        oldScript.remove();
      }

      const script =
        document.createElement('script');

      script.id = 'barcodeLookup';
      script.onerror = barcodeLookupError;

      script.src =
        BACKEND_URL +
        '?action=product&barcode=' +
        encodeURIComponent(barcode) +
        '&callback=loadProduct&_=' +
        Date.now();

      document.body.appendChild(script);
    }


    function addToList() {
      if (!currentProduct) {
        return;
      }

      const barcode =
        String(currentProduct.barcode).trim();

      const existing =
        purchaseList.find(
          item => item.barcode === barcode
        );

      if (existing) {
        existing.quantity += 1;
      } else {
        purchaseList.push({
          barcode: barcode,
          article: currentProduct.article,
          product: currentProduct.product,
          quantity: 1,
          amount: ''
        });
      }

      renderPurchaseList();

      barcodeInput.value = '';
      productInfo.style.display = 'none';
      addToListBtn.style.display = 'none';

      currentProduct = null;

      barcodeInput.focus();
    }


    function renderPurchaseList() {
      const box =
        document.getElementById('purchaseList');

      const items =
        document.getElementById('purchaseItems');

      box.style.display =
        purchaseList.length
          ? 'block'
          : 'none';

      items.innerHTML = '';

      purchaseList.forEach(
        (item, index) => {

          const row =
            document.createElement('div');

          row.className = 'purchase-item';

          const description =
            document.createElement('div');

          description.className =
            'purchase-description';

          description.textContent =
            item.article +
            ' × ' +
            item.quantity;

          const amount =
            document.createElement('input');

          amount.type = 'number';
          amount.step = '0.01';
          amount.min = '0';
          amount.placeholder = 'ENTER AMOUNT';
          amount.className = 'amount-input';
          amount.value = item.amount;

          amount.addEventListener(
            'input',
            function() {
              purchaseList[index].amount =
                this.value;

              updateTotal();
            }
          );

          const remove =
            document.createElement('button');

          remove.type = 'button';
          remove.className = 'remove-button';
          remove.textContent = 'REMOVE';

          remove.addEventListener(
            'click',
            function() {
              purchaseList.splice(index, 1);
              renderPurchaseList();
            }
          );

          row.appendChild(description);
          row.appendChild(amount);
          row.appendChild(remove);

          items.appendChild(row);
        }
      );

      updateTotal();
    }


    function updateTotal() {
      const total =
        purchaseList.reduce(
          (sum, item) =>
            sum +
            (Number(item.amount) || 0),
          0
        );

      document
        .getElementById('totalAmount')
        .textContent =
          'TOTAL: ' +
          total.toFixed(2) +
          ' ₼';
    }


    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }


    const today = new Date();

    dateInput.value =
      new Date(
        today.getTime() -
        today.getTimezoneOffset() * 60000
      )
      .toISOString()
      .split('T')[0];


    searchBtn.addEventListener(
      'click',
      searchBarcode
    );


    addToListBtn.addEventListener(
      'click',
      addToList
    );


    barcodeInput.addEventListener(
      'keydown',
      function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          searchBarcode();
        }
      }
    );


    document
      .getElementById('form')
      .addEventListener(
        'submit',
        function(event) {

          event.preventDefault();

          const submitBtn =
            document.getElementById('submitBtn');

          if (!dateInput.value) {
            showMessage(
              'SET THE DATE',
              'error'
            );

            return;
          }

          if (!purchaseList.length) {
            showMessage(
              'PURCHASE LIST EMPTY',
              'error'
            );

            return;
          }

          const invalidAmount =
            purchaseList.some(
              item =>
                item.amount === '' ||
                !Number.isFinite(
                  Number(item.amount)
                ) ||
                Number(item.amount) <= 0
            );

          if (invalidAmount) {
            showMessage(
              'ENTER AMOUNT FOR ALL PRODUCTS',
              'error'
            );

            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'SENDING...';

          message.style.display = 'none';
          message.className = '';

          const itemsToSend =
            purchaseList.map(
              item => ({
                barcode: item.barcode,
                article: item.article,
                quantity: item.quantity,
                amount: Number(item.amount)
              })
            );

          fetch(
            BACKEND_URL,
            {
              method: 'POST',

              body:
                new URLSearchParams({
                  action: 'purchaseList',
                  date: dateInput.value,
                  items:
                    JSON.stringify(itemsToSend)
                })
            }
          )

          .then(
            response => response.text()
          )

          .then(
            result => {
              if (result.trim() !== 'OK') {
                throw new Error(result);
              }

              showMessage(
                'ALL DATA SENT SUCCESSFULLY!',
                'success'
              );

              purchaseList = [];
              currentProduct = null;

              renderPurchaseList();

              productInfo.style.display =
                'none';

              addToListBtn.style.display =
                'none';

              barcodeInput.value = '';
              barcodeInput.focus();
            }
          )

          .catch(
            error => {
              showMessage(
                'ERROR: ' + error.message,
                'error'
              );
            }
          )

          .finally(
            () => {
              submitBtn.disabled = false;
              submitBtn.textContent = 'SEND';
            }
          );
        }
      );


    function goHome() {
      window.location.href = 'HOME.html';
    }
  </script>

</body>
</html>
