<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #111;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 5px 22px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 5px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 8px;
      text-transform: uppercase;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 17px;
      background: #fff;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #111;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 700;
      display: none;
    }

    .success {
      display: block !important;
      background: #e7f7e9;
      color: #176b2c;
    }

    .error {
      display: block !important;
      background: #fde8e8;
      color: #a11;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>CLOUD DRIVE</h1>
      <div class="subtitle">DATA ENTRY</div>

      <form id="form">
        <label for="date">1. ВЫБЕРИ ДАТУ</label>
        <input id="date" type="date" required>

        <label for="product">2. ВЫБЕРИ ТОВАР</label>
        <select id="product" required>
          <option value="">Выберите товар</option>
          <option value="ОБУВЬ">ОБУВЬ</option>
          <option value="ПОЛО">ПОЛО</option>
          <option value="БРЮКИ">БРЮКИ</option>
          <option value="СПОРТ КОСТЮМ">СПОРТ КОСТЮМ</option>
          <option value="КУРТКА">КУРТКА</option>
        </select>

        <label for="quantity">3. ВЫБЕРИ КОЛ-ВО</label>
        <select id="quantity" required>
          <option value="">Выберите количество</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
          <option>9</option>
          <option>10</option>
          
        </select>

        <label for="amount">4. ВЫБЕРИ СУММУ</label>
        <input id="amount" type="number" min="0" step="0.01"
               placeholder="Введите сумму" required>

        <button id="submitBtn" type="submit">ОТПРАВИТЬ</button>

        <button type="button" onclick="goHome()">
  ОБРАТНО
</button>

        <div id="message"></div>
      </form>
    </div>
  </div>

<script>
  const dateInput = document.getElementById('date');
  const today = new Date();
  dateInput.value =
    new Date(today.getTime() - today.getTimezoneOffset() * 60000)
      .toISOString().split('T')[0];

  document.getElementById('form').addEventListener('submit', function(e) {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('message');

    btn.disabled = true;
    btn.textContent = 'ОТПРАВКА...';
    msg.className = '';
    msg.style.display = 'none';

    const data = {
      date: dateInput.value,
      product: document.getElementById('product').value,
      quantity: document.getElementById('quantity').value,
      amount: document.getElementById('amount').value
    };

    google.script.run
      .withSuccessHandler(function() {
        msg.textContent = '✓ Данные успешно отправлены!';
        msg.className = 'success';

        document.getElementById('form').reset();
        dateInput.value =
          new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
            .toISOString().split('T')[0];

        btn.disabled = false;
        btn.textContent = 'ОТПРАВИТЬ';
         })
      .withFailureHandler(function(error) {
        msg.textContent = 'Ошибка: ' + error.message;
        msg.className = 'error';

        btn.disabled = false;
        btn.textContent = 'ОТПРАВИТЬ';
      })
      .submitForm(data);
  });

 function goHome() {
    google.script.run
      .withSuccessHandler(function(html) {
        document.open();
        document.write(html);
        document.close();
      })
      .getHome();
  }

</script>
</body>
</html>
