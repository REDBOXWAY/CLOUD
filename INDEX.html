<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #FFC000;
      color: #000;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 92%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .header-right {
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 36px;
      font-weight: 700;
    }

    .date-input {
      width: 150px;
      height: 38px;
      border: 1px solid #123047;
      border-radius: 7px;
      text-align: center;
      font-size: 14px;
      background: #fff;
    }

    .date-label {
      margin-top: 7px;
      font-size: 13px;
    }

    /* =========================
       BARCODE AREA
    ========================= */

    .barcode-label {
      font-size: 13px;
      margin-bottom: 6px;
    }

    .barcode-row,
    .result-row {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) 150px;
      gap: 18px;
      max-width: 570px;
      margin-bottom: 16px;
    }

    #barcode {
      width: 100%;
      height: 38px;
      border: 1px solid #123047;
      border-radius: 7px;
      text-align: center;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .small-button {
      height: 38px;
      border: 1px solid #123047;
      border-radius: 7px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-size: 13px;
    }

    .small-button:hover {
      background: #f2f2f2;
    }

    /* =========================
       PRODUCT RESULT
    ========================= */

    #productInfo {
      min-height: 38px;
      border: 1px solid #123047;
      border-radius: 7px;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 7px 12px;
      font-size: 13px;
      background: #fff;
      color: #000;
    }

    #addToListBtn {
      display: none;
    }

    /* =========================
       PURCHASE HEADER
    ========================= */

    .purchase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 5px 7px;
      font-weight: 700;
      font-size: 13px;
    }

    #totalAmount {
      font-weight: 700;
    }

    /* =========================
       PURCHASE LIST
    ========================= */

    #purchaseList {
      display: none;
      width: 100%;
      min-height: 245px;
      border: 1px solid #123047;
      padding: 14px 16px;
      background: #fff;
    }

    .purchase-item {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 150px 150px;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .purchase-description {
      font-size: 13px;
      white-space: normal;
    }

    .amount-input {
      width: 100%;
      height: 38px;
      border: 1px solid #123047;
      border-radius: 7px;
      padding: 0 12px;
      font-size: 13px;
      text-align: center;
      background: #fff;
    }

    .remove-button {
      height: 38px;
      border: 1px solid #123047;
      border-radius: 7px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-size: 13px;
    }

    .remove-button:hover {
      background: #f2f2f2;
    }

    /* =========================
       BOTTOM BUTTONS
    ========================= */

    .bottom-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 16px;
    }

    .bottom-button {
      height: 38px;
      border: 1px solid #123047;
      border-radius: 7px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-size: 13px;
    }

    .bottom-button:hover {
      background: #f2f2f2;
    }

    /* =========================
       MESSAGE
    ========================= */

    #message {
      display: none;
      width: 400px;
      max-width: 100%;
      margin: 30px auto 0;
      padding: 11px 15px;
      border: 1px solid #123047;
      border-radius: 7px;
      text-align: center;
      font-size: 13px;
    }

    .success {
      display: block !important;
      background: #8fd14f;
      color: #000;
    }

    .error {
      display: block !important;
      background: red;
      color: #000;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .page {
        width: 94%;
        padding-top: 18px;
      }

      .header {
        justify-content: center;
      }

      h1 {
        font-size: 28px;
      }

      .barcode-row,
      .result-row {
        grid-template-columns: 1fr;
        gap: 8px;
        max-width: none;
      }

      .purchase-item {
        grid-template-columns: 1fr;
      }

      #purchaseList {
        min-height: 180px;
      }

      .bottom-buttons {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .purchase-header {
        font-size: 12px;
      }
    }
  </style>
</head>


<body>

<div class="page">

  <!-- HEADER -->

  <div class="header">

    <div class="header-right">

      <h1>CLOUD DRIVE</h1>

      <input
        id="date"
        class="date-input"
        type="date"
        required
      >

      <div class="date-label">
        SET THE DATE
      </div>

    </div>

  </div>


  <form id="form">

    <!-- BARCODE -->

    <div class="barcode-label">
      ENTER BARCODE
    </div>

    <div class="barcode-row">

      <input
        id="barcode"
        type="text"
        placeholder=""
      >

      <button
        type="button"
        class="small-button"
        onclick="searchBarcode()"
      >
        SEARCH BARCODE
      </button>

    </div>


    <!-- SEARCH RESULT -->

    <div class="result-row">

      <div id="productInfo"></div>

      <button
        id="addToListBtn"
        type="button"
        class="small-button"
        onclick="addToList()"
      >
        ADD TO LIST
      </button>

    </div>


    <!-- PURCHASE HEADER -->

    <div class="purchase-header">

      <span>
        PURCHASE LIST
      </span>

      <span id="totalAmount">
        TOTAL: 0.00 ₼
      </span>

    </div>


    <!-- PURCHASE LIST -->

    <div id="purchaseList">

      <div id="purchaseItems"></div>

    </div>


    <!-- BOTTOM BUTTONS -->

    <div class="bottom-buttons">

      <button
        id="submitBtn"
        type="submit"
        class="bottom-button"
      >
        SEND
      </button>

      <button
        type="button"
        class="bottom-button"
        onclick="goHome()"
      >
        BACK
      </button>

    </div>


    <!-- MESSAGE -->

    <div id="message"></div>

  </form>

</div>



<script>

/* ==========================================
   DATA
========================================== */

let currentProduct = null;
let purchaseList = [];


/* ==========================================
   PRODUCT SEARCH RESULT
========================================== */

function loadProduct(data) {

  const info =
    document.getElementById('productInfo');

  const addBtn =
    document.getElementById('addToListBtn');


  if (!data) {

    currentProduct = null;

    info.style.display = 'flex';
    info.style.background = 'red';
    info.style.color = '#000';
    info.style.border = '1px solid #000';

    info.textContent =
      'BARCODE NOT FOUND';

    addBtn.style.display = 'none';

    return;
  }


  currentProduct = data;

  info.style.display = 'flex';
  info.style.background = '#fff';
  info.style.color = '#000';
  info.style.border = '1px solid #123047';

  info.textContent =
    data.product + ' – ' +
    data.size + ' – ' +
    data.color + ' – ' +
    data.gender + ' – ' +
    data.barcode;

  addBtn.style.display = 'block';
}


/* ==========================================
   SEARCH BARCODE
========================================== */

function searchBarcode() {

  const barcode =
    document
      .getElementById('barcode')
      .value
      .trim();


  if (!barcode) {
    return;
  }


  const oldScript =
    document.getElementById(
      'barcodeLookup'
    );


  if (oldScript) {
    oldScript.remove();
  }


  const script =
    document.createElement('script');


  script.id =
    'barcodeLookup';


  script.src =
    'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec?action=product&barcode=' +
    encodeURIComponent(barcode) +
    '&callback=loadProduct';


  document.body.appendChild(script);
}


/* ==========================================
   ADD TO LIST
========================================== */

function addToList() {

  if (!currentProduct) {
    return;
  }


  const barcode =
    String(
      currentProduct.barcode
    ).trim();


  const existing =
    purchaseList.find(
      item =>
        item.barcode === barcode
    );


  if (existing) {

    existing.quantity += 1;

  }

  else {

    purchaseList.push({

      barcode:
        barcode,

      product:
        currentProduct.product,

      size:
        currentProduct.size,

      color:
        currentProduct.color,

      brand:
        currentProduct.brand,

      gender:
        currentProduct.gender,

      quantity:
        1,

      amount:
        ''

    });

  }


  renderPurchaseList();


  document
    .getElementById('barcode')
    .value = '';


  document
    .getElementById('productInfo')
    .style.display = 'none';


  document
    .getElementById('addToListBtn')
    .style.display = 'none';


  currentProduct = null;
}


/* ==========================================
   RENDER PURCHASE LIST
========================================== */

function renderPurchaseList() {

  const box =
    document.getElementById(
      'purchaseList'
    );


  const items =
    document.getElementById(
      'purchaseItems'
    );


  box.style.display =
    'block';


  items.innerHTML =
    '';


  purchaseList.forEach(
    (item, index) => {


      const row =
        document.createElement(
          'div'
        );


      row.className =
        'purchase-item';


      const description =
        document.createElement(
          'div'
        );


      description.className =
        'purchase-description';


      description.textContent =

        item.product + ' – ' +
        item.size + ' – ' +
        item.color + ' – ' +
        item.gender + ' – ' +
        item.barcode +
        '  × ' +
        item.quantity;


      const amount =
        document.createElement(
          'input'
        );


      amount.type =
        'number';


      amount.step =
        '0.01';


      amount.placeholder =
        'ENTER AMOUNT';


      amount.className =
        'amount-input';


      amount.value =
        item.amount || '';


      amount.addEventListener(
        'input',
        function() {

          purchaseList[index].amount =
            this.value;

          updateTotal();

        }
      );


      const remove =
        document.createElement(
          'button'
        );


      remove.type =
        'button';


      remove.className =
        'remove-button';


      remove.textContent =
        'REMOVE';


      remove.addEventListener(
        'click',
        function() {

          removeFromList(index);

        }
      );


      row.appendChild(
        description
      );


      row.appendChild(
        amount
      );


      row.appendChild(
        remove
      );


      items.appendChild(
        row
      );

    }
  );


  updateTotal();
}


/* ==========================================
   TOTAL
========================================== */

function updateTotal() {

  let total = 0;


  purchaseList.forEach(
    item => {

      total +=
        Number(item.amount) || 0;

    }
  );


  document
    .getElementById(
      'totalAmount'
    )
    .textContent =

      'TOTAL: ' +
      total.toFixed(2) +
      ' ₼';
}


/* ==========================================
   REMOVE
========================================== */

function removeFromList(index) {

  purchaseList.splice(
    index,
    1
  );


  if (
    purchaseList.length === 0
  ) {

    document
      .getElementById(
        'purchaseItems'
      )
      .innerHTML = '';


    document
      .getElementById(
        'purchaseList'
      )
      .style.display =
        'none';


    updateTotal();

  }

  else {

    renderPurchaseList();

  }
}


/* ==========================================
   DEFAULT DATE
========================================== */

const dateInput =
  document.getElementById('date');


const today =
  new Date();


dateInput.value =

  new Date(

    today.getTime() -

    today.getTimezoneOffset()
    * 60000

  )

  .toISOString()

  .split('T')[0];


/* ==========================================
   SEND DATA
========================================== */

document
  .getElementById('form')
  .addEventListener(
    'submit',
    function(e) {


      e.preventDefault();


      const btn =
        document.getElementById(
          'submitBtn'
        );


      const msg =
        document.getElementById(
          'message'
        );


      if (
        purchaseList.length === 0
      ) {

        msg.textContent =
          'PURCHASE LIST EMPTY';

        msg.className =
          'error';

        return;
      }


      const invalidAmount =
        purchaseList.some(
          item =>
            item.amount === '' ||
            !Number.isFinite(
              Number(item.amount)
            ) ||
            Number(item.amount) === 0
        );


      if (invalidAmount) {

        msg.textContent =
          'ENTER AMOUNT FOR ALL PRODUCTS';

        msg.className =
          'error';

        return;
      }


      btn.disabled =
        true;


      btn.textContent =
        'SENDING...';


      msg.className =
        '';


      msg.style.display =
        'none';


      const data = {

        action:
          'purchaseList',

        date:
          dateInput.value,

        items:
          JSON.stringify(
            purchaseList
          )

      };


      fetch(

        'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec',

        {

          method:
            'POST',

          body:
            new URLSearchParams(
              data
            )

        }

      )


      .then(
        response =>
          response.text()
      )


      .then(
        result => {


          if (
            result === 'OK'
          ) {


            msg.textContent =
              'ALL DATA SENT SUCCESSFULLY!';


            msg.className =
              'success';


            purchaseList =
              [];


            document
              .getElementById(
                'purchaseItems'
              )
              .innerHTML =
                '';


            document
              .getElementById(
                'purchaseList'
              )
              .style.display =
                'none';


            currentProduct =
              null;


            document
              .getElementById(
                'productInfo'
              )
              .style.display =
                'none';


            document
              .getElementById(
                'addToListBtn'
              )
              .style.display =
                'none';


            document
              .getElementById(
                'barcode'
              )
              .value =
                '';


            updateTotal();


            btn.disabled =
              false;


            btn.textContent =
              'SEND';

          }

          else {

            throw new Error(
              result
            );

          }

        }
      )


      .catch(
        error => {


          msg.textContent =
            'ERROR: ' +
            error.message;


          msg.className =
            'error';


          btn.disabled =
            false;


          btn.textContent =
            'SEND';

        }
      );

    }
  );


/* ==========================================
   BACK
========================================== */

function goHome() {

  window.location.href =
    'HOME.html';

}

</script>

</body>
</html>
