<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: "Bebas Neue", sans-serif;
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  button,
  input,
  textarea,
  select,
  option {
    font-family: "Bebas Neue", sans-serif;
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .page {
    width: 92%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 0 40px;
  }

  .header {
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    margin-bottom: 28px;
  }

  .header-right {
    text-align: center;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 44px;
    font-weight: 400;
    line-height: 1;
  }

  .date-input {
    width: 168px;
    height: 42px;
    border: 1px solid #ffc000;
    border-radius: 7px;
    text-align: center;
    font-size: 18px;
    background: #fff;
    color: #000;
  }

  .date-label {
    margin-top: 8px;
    font-size: 17px;
  }

  .barcode-label {
    margin-bottom: 8px;
    font-size: 17px;
  }

  .barcode-row,
  .result-row {
    display: grid;
    grid-template-columns: minmax(300px, 1fr) 160px;
    gap: 18px;
    max-width: 640px;
    margin-bottom: 18px;
  }

  #barcode {
    width: 100%;
    height: 44px;
    border: 1px solid #ffc000;
    border-radius: 7px;
    text-align: center;
    font-size: 19px;
    outline: none;
    background: #fff;
    color: #000;
  }

  .small-button,
  .bottom-button {
    height: 44px;
    border: 1px solid #ffc000;
    border-radius: 7px;
    background: #ffc000;
    color: #000;
    cursor: pointer;
    font-size: 18px;
    font-weight: 400;
  }

  .small-button:hover,
  .bottom-button:hover {
    filter: brightness(0.95);
  }

  .small-button:disabled,
  .bottom-button:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }

  .search-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-actions .small-button {
    flex: 1;
  }

  .clear-search-button {
    display: flex;
    width: 44px;
    height: 44px;
    flex: 0 0 44px;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    background: transparent;
    color: #8fd14f;
    cursor: pointer;
  }

  .clear-search-button svg {
    width: 34px;
    height: 34px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .clear-search-button:hover {
    filter: brightness(1.18);
  }

  #productInfo {
    min-height: 44px;
    border: 1px solid #ffc000;
    border-radius: 7px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 8px 14px;
    text-align: center;
    font-size: 18px;
    font-weight: 400;
    background: #fff;
    color: #000;
    overflow-wrap: anywhere;
  }

  #addToListBtn {
    display: none;
  }

  .purchase-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 24px 5px 10px;
    font-weight: 400;
    font-size: 18px;
  }

  #purchaseList {
    display: none;
    width: 100%;
    min-height: 245px;
    border: 1px solid #ffc000;
    padding: 16px 18px;
    background: #000;
    color: #fff;
  }

  .purchase-item {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) 170px 150px;
    gap: 14px;
    align-items: center;
    margin-bottom: 12px;
  }

  .purchase-description {
    font-size: 18px;
    font-weight: 400;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }

  .amount-input {
    width: 100%;
    height: 44px;
    border: 1px solid #ffc000;
    border-radius: 7px;
    padding: 0 12px;
    text-align: center;
    font-size: 18px;
    font-weight: 400;
    background: #fff;
    color: #000;
  }

  .remove-button {
    height: 44px;
    border: 1px solid #ffc000;
    border-radius: 7px;
    background: red;
    color: #000;
    cursor: pointer;
    font-size: 18px;
    font-weight: 400;
  }

  .bottom-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 18px;
  }

  #message {
    display: none;
    width: 500px;
    max-width: 100%;
    margin: 30px auto 0;
    padding: 11px 15px;
    text-align: center;
    font-size: 19px;
    font-weight: 400;
  }

  .success {
    display: block !important;
    background: transparent;
    color: #8fd14f;
    border: none !important;
    padding: 0 !important;
  }

  .error {
    display: block !important;
    background: transparent;
    color: red;
    border: none !important;
    padding: 0 !important;
  }

  @media (max-width: 700px) {
    .page {
      width: 94%;
      padding-top: 18px;
    }

    .header {
      justify-content: center;
    }

    h1 {
      font-size: 38px;
    }

    .barcode-row,
    .result-row,
    .purchase-item,
    .bottom-buttons {
      grid-template-columns: 1fr;
    }

    .barcode-row,
    .result-row {
      gap: 10px;
      max-width: none;
    }

    .purchase-item {
      gap: 10px;
    }

    .bottom-buttons {
      gap: 10px;
    }

    #purchaseList {
      min-height: 180px;
    }

    .purchase-header {
      font-size: 17px;
    }

    .small-button,
    .bottom-button,
    .remove-button {
      font-size: 18px;
    }
  }
</style>
