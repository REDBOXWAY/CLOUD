<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>SALES ANALYTICS</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      color: #000000;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-weight: 400;
    }

    button,
    table,
    th,
    td {
      font-family: "Arial Narrow", Arial, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 40px auto;
    }

    h1 {
      text-align: center;
      margin: 0 0 36px;
      color: #000000;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 44px;
      font-weight: 400;
      line-height: 1;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      color: #000000;
      font-size: 20px;
    }

    th,
    td {
      padding: 6px 6px;
      border: 1px solid #000000;
      text-align: center;
      font-weight: 400;
      white-space: nowrap;
      background: #ffffff;
      color: #000000;
    }

    th {
      font-size: 20px;
      font-weight: 400;
    }

    .total-row td {
      background: #ffffff;
      color: #000000;
      font-size: 20px;
      font-weight: 400;
    }

    .day-separator td {
      height: 16px;
      padding: 0;
      background: #ffffff;
      border-left: none;
      border-right: none;
      border-top: none;
      border-bottom: none;
    }

    button {
      width: 100%;
      height: 46px;
      margin-top: 30px;
      border: 1px solid #000000;
      border-radius: 7px;
      cursor: pointer;
      background: #ffc000;
      color: #000000;
      font-size: 20px;
      font-weight: 400;
    }

    button:hover {
      filter: brightness(0.95);
    }

    @media (max-width: 700px) {

      .container {
        width: 94%;
        margin: 24px auto 35px;
      }

      h1 {
        font-size: 34px;
        margin-bottom: 28px;
      }

      table {
        font-size: 18px;
      }

      th {
        font-size: 19px;
      }

      .total-row td {
        font-size: 19px;
      }

      th,
      td {
        padding: 10px 8px;
      }

      button {
        height: 46px;
        font-size: 20px;
      }

    }

    #cloud-tools #analytics-excel { width:56px; height:56px; margin-top:30px; padding:4px; border:0; background:transparent; display:grid; place-items:center; flex-shrink:0; }
    #analytics-excel img { display:block; width:48px; height:44px; object-fit:contain; border-radius:7px; }
    #analytics-excel:focus-visible { outline:2px solid #ffd633; outline-offset:3px; }
  </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud-api.js?v=saved-font-24-v3"></script>
</head>


<body>

  <div class="container">

    <h1>
      SALES ANALYTICS
    </h1>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              DATE
            </th>

            <th>
              ARTICLE
            </th>

            <th>
              UNIT
            </th>

            <th>
              AMOUNT
            </th>

          </tr>

        </thead>


        <tbody id="salesData"></tbody>

      </table>

    </div>


    <button
      onclick="window.location.href='HOME.html'"
    >
      BACK
    </button>

  </div>



  <script>

    function addAnalyticsExport() {
      const bar = document.getElementById('cloud-tools');
      if (!bar || document.getElementById('analytics-excel')) return;
      const button = document.createElement('button');
      button.id = 'analytics-excel';
      button.type = 'button';
      button.title = 'EXTRACT ANALYTICS DATA TO EXCEL';
      button.setAttribute('aria-label', button.title);
      button.innerHTML = '<img src="assets/excel-icon-transparent.png" alt="" aria-hidden="true">';
      button.onclick = () => {
        try { exportAnalyticsExcel(); } catch (error) { CloudAPI.showError(error); }
      };
      bar.insertBefore(button, bar.querySelector('.cloud-logout'));
    }

    // Build an XLSX workbook locally. Product labels are always text, never formulas.
    function exportAnalyticsExcel() {
      const xml = value => String(value).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
      const rows = Array.from(document.querySelectorAll('table thead tr, #salesData tr:not(.day-separator)'));
      const quantities = [1, 2];
      const sheetRows = rows.map((row, r) => '<row r="' + (r+1) + '">' + Array.from(row.cells).map((cell, c) => {
        const address = String.fromCharCode(65+c) + (r+1);
        const value = cell.textContent.trim();
        if (r > 0 && (c >= 2 || (c === 1 && row.classList.contains('total-row'))) && value !== '—' && value !== '') {
          const number = Number(value.replace(/\s|₼/g, ''));
          if (!Number.isFinite(number)) throw new Error('Invalid analytics value: ' + value);
          return '<c r="'+address+'" s="'+(quantities.includes(c)?1:2)+'"><v>'+number+'</v></c>';
        }
        return '<c r="'+address+'" t="inlineStr"><is><t xml:space="preserve">'+xml(value)+'</t></is></c>';
      }).join('') + '</row>').join('');
      const files = {
        '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
        '_rels/.rels': '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
        'xl/workbook.xml': '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="ANALYTICS" sheetId="1" r:id="rId1"/></sheets></workbook>',
        'xl/_rels/workbook.xml.rels': '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
        'xl/styles.xml': '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00 &quot;₼&quot;"/></numFmts><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf xfId="0"/><xf xfId="0" numFmtId="1" applyNumberFormat="1"/><xf xfId="0" numFmtId="164" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',
        'xl/worksheets/sheet1.xml': '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="23" customWidth="1"/><col min="2" max="2" width="48" customWidth="1"/><col min="3" max="4" width="23" customWidth="1"/></cols><sheetData>'+sheetRows+'</sheetData>'+'</worksheet>'
      };
      const blob = new Blob([analyticsZip(files)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'ANALYTICS_' + CloudAPI.today() + '.xlsx';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    // ZIP STORE records with UTF-8 names and CRC-32, sufficient for OOXML packages.
    function analyticsZip(files) {
      const encoder = new TextEncoder(), chunks = [], directory = [];
      let offset = 0;
      const header = size => {const bytes=new Uint8Array(size); return [bytes,new DataView(bytes.buffer)];};
      for (const [name, content] of Object.entries(files)) {
        const filename=encoder.encode(name), data=encoder.encode(content);
        let crc=0xffffffff;
        for(const byte of data) {crc ^= byte; for(let bit=0;bit<8;bit++) crc=(crc>>>1)^((crc&1)?0xedb88320:0);}
        crc=(crc^0xffffffff)>>>0;
        const [local,l]=header(30);
        l.setUint32(0,0x04034b50,true); l.setUint16(4,20,true); l.setUint16(6,0x800,true); l.setUint16(12,33,true);
        l.setUint32(14,crc,true); l.setUint32(18,data.length,true); l.setUint32(22,data.length,true); l.setUint16(26,filename.length,true);
        chunks.push(local,filename,data);
        const [central,c]=header(46);
        c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x800,true); c.setUint16(14,33,true);
        c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,filename.length,true); c.setUint32(42,offset,true);
        directory.push(central,filename); offset+=local.length+filename.length+data.length;
      }
      const size=directory.reduce((sum,chunk)=>sum+chunk.length,0);
      const [end,e]=header(22); e.setUint32(0,0x06054b50,true); e.setUint16(8,directory.length/2,true); e.setUint16(10,directory.length/2,true); e.setUint32(12,size,true); e.setUint32(16,offset,true);
      const result=new Uint8Array(offset+size+end.length); let position=0;
      for(const chunk of [...chunks,...directory,end]) {result.set(chunk,position);position+=chunk.length;}
      return result;
    }


    function loadAnalytics(data) {

      const table =
        document.getElementById(
          'salesData'
        );

      table.innerHTML =
        '';

      const days =
        {};


      data.forEach(
        item => {

          const date =
            new Date(
              item.date
            )
            .toLocaleDateString(
              'en-GB'
            );


          if (
            !days[date]
          ) {

            days[date] =
              [];

          }


          days[date].push(
            item
          );

        }
      );



      Object.keys(
        days
      )
      .forEach(
        date => {

          const items =
            days[date];


          let totalQuantity =
            0;


          let totalAmount =
            0;



          items.forEach(
            item => {

              totalQuantity +=
                Number(
                  item.quantity
                );


              totalAmount +=
                Number(
                  item.amount
                );


              let category =
                item.category;


              if (
                category === 'БРЮКИ'
              ) {

                category =
                  'PANTS';

              }


              if (
                category === 'ПОЛО'
              ) {

                category =
                  'POLO';

              }


              if (
                category === 'ОБУВЬ'
              ) {

                category =
                  'SHOES';

              }


              if (
                category ===
                'СПОРТ КОСТЮМ'
              ) {

                category =
                  'SPORT SUIT';

              }



              const row =
                document.createElement(
                  'tr'
                );


              row.innerHTML = `
                <td>${CloudAPI.escape(date)}</td>
                <td>${CloudAPI.escape(category)}</td>
                <td>${item.quantity}</td>
                <td>${Number(item.amount).toFixed(2)} ₼</td>
              `;


              table.appendChild(
                row
              );

            }
          );



          const totalRow =
            document.createElement(
              'tr'
            );


          totalRow.className =
            'total-row';


          totalRow.innerHTML = `
            <td>${CloudAPI.escape(date)}</td>
            <td>${items.length}</td>
            <td>${totalQuantity}</td>
            <td>${totalAmount.toFixed(2)} ₼</td>
          `;


          table.appendChild(
            totalRow
          );



          const separator =
            document.createElement(
              'tr'
            );


          separator.className =
            'day-separator';


          separator.innerHTML = `
            <td colspan="4"></td>
          `;


          table.appendChild(
            separator
          );

        }
      );

    }



    CloudAPI.read("analytics").then(data => { loadAnalytics(data); addAnalyticsExport(); }).catch(CloudAPI.showError);

  </script>

</body>

</html>
