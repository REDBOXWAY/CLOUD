<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Аналитика продаж</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
    }

    th, td {
      padding: 8px;
      border: 1px solid #444;
      text-align: center;
    }

    th {
      background: #fff;
      color: #000;
    }

    .total-row td {
      background: #fff;
      color: #000;
      font-weight: bold;
    }

    .day-separator td {
      height: 15px;
      padding: 0;
      background: #000;
      border: none;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 8px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #FFC000;
      color: #000000;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>АНАЛИТИКА ПРОДАЖ</h1>

  <table>

    <thead>
      <tr>
        <th>ДАТА</th>
        <th>КАТЕГОРИЯ</th>
        <th>КОЛ-ВО</th>
        <th>СУММА</th>
      </tr>
    </thead>

    <tbody id="salesData"></tbody>

  </table>

  <button onclick="window.location.href='HOME.html'">
    ОБРАТНО
  </button>

</div>


<script>

function loadAnalytics(data) {

  const table = document.getElementById('salesData');

  table.innerHTML = '';

  // ГРУППИРУЕМ ПОЛУЧЕННЫЕ ДАННЫЕ ПО ДНЯМ
  const days = {};

  data.forEach(item => {

    const date =
      new Date(item.date).toLocaleDateString('ru-RU');

    if (!days[date]) {
      days[date] = [];
    }

    days[date].push(item);

  });


  // ВЫВОДИМ КАЖДЫЙ ДЕНЬ
  Object.keys(days).forEach(date => {

    const items = days[date];

    let totalQuantity = 0;
    let totalAmount = 0;


    // КАТЕГОРИИ ЭТОГО ДНЯ
    items.forEach(item => {

      totalQuantity += Number(item.quantity);
      totalAmount += Number(item.amount);

      const row = document.createElement('tr');

      row.innerHTML = `
        <td>${date}</td>
        <td>${item.category}</td>
        <td>${item.quantity}</td>
        <td>${Number(item.amount).toFixed(2)}</td>
      `;

      table.appendChild(row);

    });


    // ИТОГО ЗА ЭТОТ ДЕНЬ
    const totalRow = document.createElement('tr');

    totalRow.className = 'total-row';

    totalRow.innerHTML = `
      <td>${date}</td>
      <td>${items.length}</td>
      <td>${totalQuantity}</td>
      <td>${totalAmount.toFixed(2)}</td>
    `;

    table.appendChild(totalRow);


    // ПРОМЕЖУТОК МЕЖДУ ДНЯМИ
    const separator = document.createElement('tr');

    separator.className = 'day-separator';

    separator.innerHTML = `
      <td colspan="4"></td>
    `;

    table.appendChild(separator);

  });

}


// ЗАГРУЗКА ДАННЫХ ИЗ GOOGLE SHEETS

const script = document.createElement('script');

script.src =
  'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec?action=analytics&callback=loadAnalytics';

document.body.appendChild(script);

</script>

</body>
</html>
