<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Аналитика продаж</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
    }

    th, td {
      padding: 15px;
      border: 1px solid #444;
      text-align: center;
    }

    th {
      background: #fff;
      color: #000;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>АНАЛИТИКА ПРОДАЖ</h1>

  <table>
    <thead>
      <tr>
        <th>ДАТА</th>
        <th>КАТЕГОРИЯ</th>
        <th>КОЛ-ВО</th>
        <th>СУММА</th>
      </tr>
    </thead>

    <tbody id="salesData">
    </tbody>
  </table>

  <button onclick="window.location.href='HOME.html'">
    ОБРАТНО
  </button>

</div>
<script>
function loadAnalytics(data) {

  const table = document.getElementById('salesData');

  table.innerHTML = '';

  data.forEach(item => {

    const row = document.createElement('tr');

    row.innerHTML = `
      <td>${item.date}</td>
      <td>${item.category}</td>
      <td>${item.quantity}</td>
      <td>${Number(item.amount).toFixed(2)}</td>
    `;

    table.appendChild(row);
  });
}

const script = document.createElement('script');

script.src =
  'https://script.google.com/macros/s/AKfycbzA6KpT_SYSpAX2o8iJ3yUpJQ8x87UHZ44A0kWIEcDb9NLUtHgL_K9iuUtHfs1qfNnB/exec?action=analytics&callback=loadAnalytics';

document.body.appendChild(script);
</script>
</body>
</html>
