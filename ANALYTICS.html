<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SALES ANALYTICS</title>

  <style>
    body {
      margin: 0;
      font-family: "Arial Nova Cond", "Arial Narrow", Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      font-weight: normal;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-weight: normal;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
      font-weight: normal;
    }

    th, td {
      padding: 8px;
      border: 1px solid #444;
      text-align: center;
      font-weight: normal;
    }

    th {
      background: #fff;
      color: #000;
      font-weight: normal;
    }

    .total-row td {
      background: #fff;
      color: #000;
      font-weight: normal;
    }

    .day-separator td {
      height: 15px;
      padding: 0;
      background: #000;
      border: none;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 8px;
      font-size: 18px;
      font-weight: normal;
      font-family: "Arial Nova Cond", "Arial Narrow", Arial, sans-serif;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #FFC000;
      color: #000000;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SALES ANALYTICS</h1>

  <table>

    <thead>
      <tr>
        <th>DATE</th>
        <th>CATEGORY</th>
        <th>QUANTITY</th>
        <th>AMOUNT</th>
      </tr>
    </thead>

    <tbody id="salesData"></tbody>

  </table>

  <button onclick="window.location.href='HOME.html'">
    BACK
  </button>

</div>


<script>

function loadAnalytics(data) {

  const table = document.getElementById('salesData');

  table.innerHTML = '';

  const days = {};

  data.forEach(item => {

    const date =
      new Date(item.date).toLocaleDateString('en-GB');

    if (!days[date]) {
      days[date] = [];
    }

    days[date].push(item);

  });


  Object.keys(days).forEach(date => {

    const items = days[date];

    let totalQuantity = 0;
    let totalAmount = 0;


    items.forEach(item => {

      totalQuantity += Number(item.quantity);
      totalAmount += Number(item.amount);

      let category = item.category;

      if (category === 'БРЮКИ') category = 'PANTS';
      if (category === 'ПОЛО') category = 'POLO';
      if (category === 'ОБУВЬ') category = 'SHOES';
      if (category === 'СПОРТ КОСТЮМ') category = 'SPORT SUIT';

      const row = document.createElement('tr');

      row.innerHTML = `
        <td>${date}</td>
        <td>${category}</td>
        <td>${item.quantity}</td>
        <td>${Number(item.amount).toFixed(2)} ₼</td>
      `;

      table.appendChild(row);

    });


    const totalRow = document.createElement('tr');

    totalRow.className = 'total-row';

    totalRow.innerHTML = `
      <td>${date}</td>
      <td>${items.length}</td>
      <td>${totalQuantity}</td>
      <td>${totalAmount.toFixed(2)} ₼</td>
    `;

    table.appendChild(totalRow);


    const separator = document.createElement('tr');

    separator.className = 'day-separator';

    separator.innerHTML = `
      <td colspan="4"></td>
    `;

    table.appendChild(separator);

  });

}


const script = document.createElement('script');

script.src =
  'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec?action=analytics&callback=loadAnalytics';

document.body.appendChild(script);

</script>

</body>
</html>
