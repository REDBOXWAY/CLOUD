<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ВОЗВРАТЫ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
    }

    th, td {
      padding: 8px;
      border: 1px solid #444;
      text-align: center;
    }

    th {
      background: #fff;
      color: #000;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 8px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #FFC000;
      color: #000;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ВОЗВРАТЫ</h1>

  <table>
    <thead>
      <tr>
        <th>ДАТА</th>
        <th>ТОВАР</th>
        <th>КОЛ-ВО</th>
        <th>СУММА</th>
      </tr>
    </thead>

    <tbody id="returnData"></tbody>
  </table>

  <button onclick="window.location.href='HOME.html'">
    ОБРАТНО
  </button>

</div>
<script>
function loadReturns(data) {

  const table = document.getElementById('returnData');
  table.innerHTML = '';

  data.forEach(item => {

    const row = document.createElement('tr');

    row.innerHTML = `
      <td>${new Date(item.date).toLocaleDateString('ru-RU')}</td>
      <td>${item.product}</td>
      <td>${item.quantity}</td>
      <td>${Number(item.amount).toFixed(2)} ₼</td>
    `;

    table.appendChild(row);
  });
}

const script = document.createElement('script');

script.src =
  'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec?action=return&callback=loadReturns';

document.body.appendChild(script);
</script>
</body>
</html>
