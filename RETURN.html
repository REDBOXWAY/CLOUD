<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RETURNS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: "Arial Nova Cond", "Arial Narrow", Arial, sans-serif;
      font-weight: normal;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 45px auto;
    }

    h1 {
      margin: 0 0 38px;
      text-align: center;
      font-weight: normal;
    }

    h2 {
      margin: 42px 0 14px;
      text-align: center;
      font-size: 20px;
      font-weight: normal;
    }

    .return-form {
      border: 1px solid #fff;
      padding: 22px;
    }

    .date-wrap {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }

    .date-box {
      text-align: center;
    }

    .date-input,
    .text-input,
    .unit-input,
    .amount-input {
      height: 40px;
      border: 1px solid #ffc000;
      border-radius: 7px;
      background: #fff;
      color: #000;
      text-align: center;
      font-size: 14px;
    }

    .date-input {
      width: 160px;
    }
    .date-input,
.text-input {
  border: 1px solid #000;
  outline: none;
  box-shadow: none;
}

.date-input:focus,
.text-input:focus {
  border: 1px solid #000;
  outline: none;
  box-shadow: none;
}

    .date-label,
    .field-label {
      margin-bottom: 7px;
      font-size: 13px;
    }

    .date-label {
      margin-top: 7px;
    }

    .search-row,
    .result-row {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) 170px;
      gap: 18px;
      max-width: 650px;
      margin-bottom: 14px;
    }

    .text-input {
      width: 100%;
    }

    button {
      border: none;
      border-radius: 9px;
      background: #ffc000;
      color: #000;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    button:hover {
      filter: brightness(0.95);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .small-button {
      height: 40px;
    }

    #productInfo {
      display: none;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      border: 1px solid #ffc000;
      border-radius: 7px;
      padding: 7px 12px;
      background: #fff;
      color: #000;
      text-align: center;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #addBtn {
      display: none;
    }

.list-header {
  display: flex;
  justify-content: space-between;
  margin: 24px 4px 9px;
  font-size: 13px;
  font-weight: 700;
}

    #returnList {
      display: none;
      min-height: 120px;
      border: 1px solid #ffc000;
      padding: 14px;
    }

    .return-item {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 110px 150px 130px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .return-description {
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .unit-input,
    .amount-input {
      width: 100%;
    }

    .remove-button {
      height: 40px;
      background: red;
      font-weight: bold;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .action-button {
      height: 42px;
      font-size: 16px;
    }

    #message {
      display: none;
      max-width: 460px;
      margin: 22px auto 0;
      padding: 11px 15px;
      border-radius: 7px;
      text-align: center;
      color: #000;
      font-size: 13px;
    }

    .success {
      display: block !important;
      background: #8fd14f;
    }

    .error {
      display: block !important;
      background: red;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
    }

    th,
    td {
      padding: 8px;
      border: 1px solid #444;
      text-align: center;
      font-weight: normal;
      white-space: nowrap;
    }

    th {
      background: #fff;
      color: #000;
    }

    .empty-row td {
      padding: 25px;
      color: #aaa;
    }

    @media (max-width: 760px) {
      .container {
        width: 94%;
        margin: 25px auto;
      }

      .return-form {
        padding: 15px;
      }

      .date-wrap {
        justify-content: center;
      }

      .search-row,
      .result-row,
      .return-item,
      .actions {
        grid-template-columns: 1fr;
      }

      .search-row,
      .result-row {
        gap: 8px;
        max-width: none;
      }

      .return-item {
        border-bottom: 1px solid #333;
        padding-bottom: 14px;
      }

      .actions {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>RETURNS</h1>

    <form id="returnForm" class="return-form">

      <div class="date-wrap">

        <div class="date-box">

          <input
            id="date"
            class="date-input"
            type="date"
            required
          >

          <div class="date-label">
            SET THE DATE
          </div>

        </div>

      </div>

      <div class="field-label">
        ENTER BARCODE
      </div>

      <div class="search-row">

        <input
          id="barcode"
          class="text-input"
          type="text"
          inputmode="numeric"
          autocomplete="off"
        >

        <button
          id="searchBtn"
          class="small-button"
          type="button"
        >
          SEARCH BARCODE
        </button>

      </div>

      <div class="result-row">

        <div id="productInfo"></div>

        <button
          id="addBtn"
          class="small-button"
          type="button"
        >
          ADD TO RETURN LIST
        </button>

      </div>

      <div class="list-header">

        <span>
          RETURN LIST
        </span>

        <span id="returnTotal">
          RETURN TOTAL: 0.00 ₼
        </span>

      </div>

      <div id="returnList">
        <div id="returnItems"></div>
      </div>

      <div class="actions">

        <button
          id="sendBtn"
          class="action-button"
          type="submit"
        >
          SEND RETURN
        </button>

        <button
          class="action-button"
          type="button"
          onclick="goHome()"
        >
          BACK
        </button>

      </div>

      <div id="message"></div>

    </form>

    <h2>RETURN HISTORY</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>DATE</th>
            <th>BARCODE</th>
            <th>ARTICLE</th>
            <th>UNIT</th>
            <th>AMOUNT</th>
          </tr>
        </thead>

        <tbody id="returnData">

          <tr class="empty-row">
            <td colspan="5">
              LOADING...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>


  <script>
    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec';

    let currentProduct = null;
    let returnList = [];

    const dateInput =
      document.getElementById('date');

    const barcodeInput =
      document.getElementById('barcode');

    const searchBtn =
      document.getElementById('searchBtn');

    const addBtn =
      document.getElementById('addBtn');

    const productInfo =
      document.getElementById('productInfo');

    const message =
      document.getElementById('message');


    const today = new Date();

    dateInput.value =
      new Date(
        today.getTime() -
        today.getTimezoneOffset() * 60000
      )
      .toISOString()
      .split('T')[0];


    function loadProduct(data) {
      searchBtn.disabled = false;

      searchBtn.textContent =
        'SEARCH BARCODE';

      if (!data) {
        currentProduct = null;

        productInfo.style.display =
          'flex';

        productInfo.style.background =
          'red';

        productInfo.textContent =
          'BARCODE NOT FOUND';

        addBtn.style.display =
          'none';

        return;
      }

      currentProduct = data;

      productInfo.style.display =
        'flex';

      productInfo.style.background =
        '#fff';

      productInfo.textContent =
        data.article;

      addBtn.style.display =
        'block';
    }


    function lookupError() {
      searchBtn.disabled = false;

      searchBtn.textContent =
        'SEARCH BARCODE';

      currentProduct = null;

      productInfo.style.display =
        'flex';

      productInfo.style.background =
        'red';

      productInfo.textContent =
        'CONNECTION ERROR';

      addBtn.style.display =
        'none';
    }


    function searchBarcode() {
      const barcode =
        barcodeInput.value.trim();

      if (!barcode) {
        return;
      }

      currentProduct = null;

      productInfo.style.display =
        'flex';

      productInfo.style.background =
        '#fff';

      productInfo.textContent =
        'SEARCHING...';

      addBtn.style.display =
        'none';

      searchBtn.disabled =
        true;

      searchBtn.textContent =
        'SEARCHING...';

      const oldScript =
        document.getElementById(
          'productLookup'
        );

      if (oldScript) {
        oldScript.remove();
      }

      const script =
        document.createElement(
          'script'
        );

      script.id =
        'productLookup';

      script.onerror =
        lookupError;

      script.src =
        BACKEND_URL +
        '?action=product&barcode=' +
        encodeURIComponent(barcode) +
        '&callback=loadProduct&_=' +
        Date.now();

      document.body.appendChild(
        script
      );
    }


    function addToReturnList() {
      if (!currentProduct) {
        return;
      }

      const barcode =
        String(
          currentProduct.barcode
        ).trim();

      const existing =
        returnList.find(
          item =>
            item.barcode === barcode
        );

      if (existing) {
        existing.unit += 1;
      } else {
        returnList.push({
          barcode: barcode,
          article:
            currentProduct.article,
          unit: 1,
          amount: ''
        });
      }

      renderReturnList();

      barcodeInput.value =
        '';

      productInfo.style.display =
        'none';

      addBtn.style.display =
        'none';

      currentProduct =
        null;

      barcodeInput.focus();
    }


    function renderReturnList() {
      const listBox =
        document.getElementById(
          'returnList'
        );

      const itemsBox =
        document.getElementById(
          'returnItems'
        );

      listBox.style.display =
        returnList.length
          ? 'block'
          : 'none';

      itemsBox.innerHTML =
        '';

      returnList.forEach(
        (item, index) => {

          const row =
            document.createElement(
              'div'
            );

          row.className =
            'return-item';

          const description =
            document.createElement(
              'div'
            );

          description.className =
            'return-description';

          description.textContent =
            item.article;

          const unit =
            document.createElement(
              'input'
            );

          unit.type =
            'number';

          unit.min =
            '1';

          unit.step =
            '1';

          unit.placeholder =
            'UNIT';

          unit.className =
            'unit-input';

          unit.value =
            item.unit;

          unit.addEventListener(
            'input',
            function() {
              returnList[index].unit =
                this.value;
            }
          );

          const amount =
            document.createElement(
              'input'
            );

          amount.type =
            'number';

          amount.min =
            '0.01';

          amount.step =
            '0.01';

          amount.placeholder =
            'AMOUNT';

          amount.className =
            'amount-input';

          amount.value =
            item.amount;

          amount.addEventListener(
            'input',
            function() {
              returnList[index].amount =
                this.value;

              updateTotal();
            }
          );

          const remove =
            document.createElement(
              'button'
            );

          remove.type =
            'button';

          remove.className =
            'remove-button';

          remove.textContent =
            'REMOVE';

          remove.addEventListener(
            'click',
            function() {
              returnList.splice(
                index,
                1
              );

              renderReturnList();
            }
          );

          row.appendChild(
            description
          );

          row.appendChild(
            unit
          );

          row.appendChild(
            amount
          );

          row.appendChild(
            remove
          );

          itemsBox.appendChild(
            row
          );
        }
      );

      updateTotal();
    }


    function updateTotal() {
      const total =
        returnList.reduce(
          (sum, item) =>
            sum +
            (
              Number(item.amount) ||
              0
            ),
          0
        );

      document
        .getElementById(
          'returnTotal'
        )
        .textContent =
          'RETURN TOTAL: ' +
          total.toFixed(2) +
          ' ₼';
    }


    function showMessage(
      text,
      type
    ) {
      message.textContent =
        text;

      message.className =
        type;
    }


    function loadReturns(data) {
      const table =
        document.getElementById(
          'returnData'
        );

      table.innerHTML =
        '';

      if (
        !Array.isArray(data) ||
        !data.length
      ) {
        table.innerHTML =
          '<tr class="empty-row">' +
          '<td colspan="5">' +
          'NO RETURNS' +
          '</td>' +
          '</tr>';

        return;
      }

      data.forEach(
        item => {

          const row =
            document.createElement(
              'tr'
            );

          const rawDate =
            item.date || '';

          const parsedDate =
            new Date(rawDate);

          const dateText =
            Number.isNaN(
              parsedDate.getTime()
            )
              ? rawDate
              : parsedDate
                  .toLocaleDateString(
                    'en-GB'
                  );

          const unit =
            item.units !== undefined
              ? item.units
              : item.quantity;

          row.innerHTML =
            '<td>' +
            escapeHtml(dateText) +
            '</td>' +

            '<td>' +
            escapeHtml(
              item.barcode || ''
            ) +
            '</td>' +

            '<td>' +
            escapeHtml(
              item.article ||
              item.product ||
              ''
            ) +
            '</td>' +

            '<td>' +
            Number(unit) +
            '</td>' +

            '<td>' +
            Number(
              item.amount
            ).toFixed(2) +
            ' ₼' +
            '</td>';

          table.appendChild(row);
        }
      );
    }


    function loadReturnHistory() {
      const oldScript =
        document.getElementById(
          'returnHistory'
        );

      if (oldScript) {
        oldScript.remove();
      }

      const script =
        document.createElement(
          'script'
        );

      script.id =
        'returnHistory';

      script.src =
        BACKEND_URL +
        '?action=return' +
        '&callback=loadReturns' +
        '&_=' +
        Date.now();

      document.body.appendChild(
        script
      );
    }


    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }


    searchBtn.addEventListener(
      'click',
      searchBarcode
    );


    addBtn.addEventListener(
      'click',
      addToReturnList
    );


    barcodeInput.addEventListener(
      'keydown',
      function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          searchBarcode();
        }
      }
    );


    document
      .getElementById(
        'returnForm'
      )
      .addEventListener(
        'submit',
        function(event) {

          event.preventDefault();

          if (!dateInput.value) {
            showMessage(
              'SET THE DATE',
              'error'
            );

            return;
          }

          if (!returnList.length) {
            showMessage(
              'RETURN LIST EMPTY',
              'error'
            );

            return;
          }

          const invalid =
            returnList.some(
              item =>
                !Number.isInteger(
                  Number(item.unit)
                ) ||
                Number(item.unit) <= 0 ||
                !Number.isFinite(
                  Number(item.amount)
                ) ||
                Number(item.amount) <= 0
            );

          if (invalid) {
            showMessage(
              'ENTER CORRECT UNIT AND AMOUNT',
              'error'
            );

            return;
          }

          const sendBtn =
            document.getElementById(
              'sendBtn'
            );

          sendBtn.disabled =
            true;

          sendBtn.textContent =
            'SENDING...';

          message.style.display =
            'none';

          message.className =
            '';

          const itemsToSend =
            returnList.map(
              item => ({
                barcode:
                  item.barcode,

                article:
                  item.article,

                quantity:
                  -Math.abs(
                    Number(item.unit)
                  ),

                amount:
                  -Math.abs(
                    Number(item.amount)
                  )
              })
            );

          fetch(
            BACKEND_URL,
            {
              method: 'POST',

              body:
                new URLSearchParams({
                  action:
                    'purchaseList',

                  date:
                    dateInput.value,

                  items:
                    JSON.stringify(
                      itemsToSend
                    )
                })
            }
          )

          .then(
            response =>
              response.text()
          )

          .then(
            result => {
              if (
                result.trim() !== 'OK'
              ) {
                throw new Error(
                  result
                );
              }

              showMessage(
                'RETURN SENT SUCCESSFULLY!',
                'success'
              );

              returnList = [];
              currentProduct = null;

              renderReturnList();

              productInfo.style.display =
                'none';

              addBtn.style.display =
                'none';

              barcodeInput.value =
                '';

              barcodeInput.focus();

              loadReturnHistory();
            }
          )

          .catch(
            error => {
              showMessage(
                'ERROR: ' +
                error.message,
                'error'
              );
            }
          )

          .finally(
            () => {
              sendBtn.disabled =
                false;

              sendBtn.textContent =
                'SEND RETURN';
            }
          );
        }
      );


    function goHome() {
      window.location.href =
        'HOME.html';
    }


    loadReturnHistory();
  </script>

</body>
</html>
