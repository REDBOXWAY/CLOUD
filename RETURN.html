<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RETURNS</title>

  <style>
    body {
      margin: 0;
      font-family: "Arial Nova Cond", "Arial Narrow", Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      font-weight: normal;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-weight: normal;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
      font-weight: normal;
    }

    th, td {
      padding: 8px;
      border: 1px solid #444;
      text-align: center;
      font-weight: normal;
    }

    th {
      background: #fff;
      color: #000;
      font-weight: normal;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 8px;
      font-size: 18px;
      font-weight: normal;
      font-family: "Arial Nova Cond", "Arial Narrow", Arial, sans-serif;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #FFC000;
      color: #000;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>RETURNS</h1>

  <table>

    <thead>
      <tr>
        <th>DATE</th>
        <th>ARTICLE</th>
        <th>UNIT</th>
        <th>AMOUNT</th>
      </tr>
    </thead>

    <tbody id="returnData"></tbody>

  </table>

  <button onclick="window.location.href='HOME.html'">
    BACK
  </button>

</div>


<script>

function loadReturns(data) {

  const table =
    document.getElementById('returnData');

  table.innerHTML = '';

  data.forEach(item => {

    const row =
      document.createElement('tr');

    row.innerHTML = `
      <td>${new Date(item.date).toLocaleDateString('en-GB')}</td>
      <td>${item.product}</td>
      <td>${item.quantity}</td>
      <td>${Number(item.amount).toFixed(2)} ₼</td>
    `;

    table.appendChild(row);

  });

}


const script =
  document.createElement('script');

script.src =
  'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec?action=return&callback=loadReturns';

document.body.appendChild(script);

</script>

</body>
</html>
