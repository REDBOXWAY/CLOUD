<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>RETURNS</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      color: #000000;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-weight: 400;
    }

    button,
    input,
    textarea,
    select,
    option,
    table,
    th,
    td {
      font-family: "Arial Narrow", Arial, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 28px auto 40px;
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      color: #000000;
      font-size: 44px;
      font-weight: 400;
      line-height: 1;
    }

    .return-form {
      border: 1px solid #000000;
      padding: 22px;
      background: #ffffff;
    }

    .date-wrap {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }

    .date-box {
      text-align: center;
    }

    .date-input,
    .text-input,
    .unit-input,
    .amount-input {
      height: 46px;
      border: 1px solid #000000;
      border-radius: 7px;
      background: #ffffff;
      color: #000000;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      outline: none;
      box-shadow: none;
    }

    .date-input:focus,
    .text-input:focus,
    .unit-input:focus,
    .amount-input:focus {
      border: 1px solid #000000;
      outline: none;
      box-shadow: none;
    }

    .date-input {
      width: 168px;
    }

    .date-label,
    .field-label {
      color: #000000;
      font-size: 19px;
      font-weight: 400;
    }

    .field-label {
      margin-bottom: 8px;
    }

    .date-label {
      margin-top: 8px;
    }

    .search-row,
    .result-row {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) 320px;
      gap: 18px;
      max-width: 780px;
      margin-bottom: 18px;
    }

    .text-input {
      width: 100%;
    }

    button {
      border: 1px solid #000000;
      border-radius: 7px;
      background: #ffc000;
      color: #000000;
      cursor: pointer;
      font-size: 20px;
      font-weight: 400;
    }

    button:hover {
      filter: brightness(0.95);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .small-button {
      height: 46px;
    }

    .search-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }

    .search-actions .small-button {
      width: 100%;
    }

    #productInfo {
      display: none;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      border: 1px solid #000000;
      border-radius: 7px;
      padding: 8px 14px;
      background: #ffffff;
      color: #000000;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      overflow-wrap: anywhere;
    }

    #addBtn {
      display: none;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      margin: 24px 5px 10px;
      color: #000000;
      font-size: 20px;
      font-weight: 400;
    }

    #returnList {
      display: none;
      min-height: 140px;
      border: 1px solid #000000;
      padding: 16px 18px;
      background: #ffffff;
      color: #000000;
    }

    .return-item {
      display: grid;
      grid-template-columns:
        minmax(260px, 1fr)
        120px
        170px
        150px;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }

    .return-description {
      color: #000000;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .unit-input,
    .amount-input {
      width: 100%;
    }

    .remove-button {
      height: 46px;
      border: 1px solid #000000;
      background: red;
      color: #000000;
      font-size: 20px;
      font-weight: 400;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .action-button {
      height: 46px;
      font-size: 20px;
      font-weight: 400;
    }

    #message {
      display: none;
      max-width: 500px;
      margin: 22px auto 0;
      padding: 11px 15px;
      text-align: center;
      color: #000000;
      font-size: 20px;
      font-weight: 400;
    }

    .success {
      display: block !important;
      background: transparent;
      color: #000000;
      font-weight: 400;
      border: none !important;
      padding: 0 !important;
    }

    .error {
      display: block !important;
      background: transparent;
      color: red;
      font-weight: 400;
      border: none !important;
      padding: 0 !important;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      color: #000000;
      font-size: 20px;
    }

    th,
    td {
      padding: 6px 6px;
      border: 1px solid #000000;
      text-align: center;
      font-weight: 400;
      white-space: nowrap;
      background: #ffffff;
      color: #000000;
    }

    th {
      font-size: 20px;
      font-weight: 400;
    }

    .empty-row td {
      padding: 12px 6px;
      color: #000000;
      font-size: 20px;
      font-weight: 400;
    }

    @media (max-width: 760px) {

      .container {
        width: 94%;
        margin: 18px auto 35px;
      }

      h1 {
        font-size: 34px;
      }

      .return-form {
        padding: 15px;
      }

      .date-wrap {
        justify-content: center;
      }

      .search-row,
      .result-row,
      .return-item,
      .actions {
        grid-template-columns: 1fr;
      }

      .search-actions {
        grid-template-columns: 1fr 1fr;
      }

      .search-row,
      .result-row {
        gap: 10px;
        max-width: none;
      }

      .return-item {
        gap: 10px;
        border-bottom: 1px solid #000000;
        padding-bottom: 14px;
      }

      .actions {
        gap: 10px;
      }

      .list-header {
        font-size: 19px;
      }

      table,
      th,
      td {
        font-size: 20px;
      }

    }

    #cloud-tools #return-excel { width:56px; height:56px; margin:0; padding:4px; border:0; background:transparent; display:grid; place-items:center; flex-shrink:0; }
    #return-excel img { display:block; width:48px; height:44px; object-fit:contain; border-radius:7px; }
    #return-excel:focus-visible { outline:2px solid #ffd633; outline-offset:3px; }
  </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud-api.js?v=saved-font-24-v3"></script>
</head>


<body>

  <div class="container">

    <h1>RETURNS</h1>


    <form
      id="returnForm"
      class="return-form"
    >

      <div class="date-wrap">

        <div class="date-box">

          <input
            id="date"
            class="date-input"
            type="date"
            required
          >

          <div class="date-label">
            SET THE DATE
          </div>

        </div>

      </div>


      <div class="field-label">
        ENTER BARCODE
      </div>


      <div class="search-row">

        <input
          id="barcode"
          class="text-input"
          type="text"
          inputmode="numeric"
          autocomplete="off"
        >


        <div class="search-actions">

          <button
            id="searchBtn"
            class="small-button"
            type="button"
          >
            SEARCH
          </button>


          <button
            id="refreshBtn"
            class="small-button"
            type="button"
          >
            REFRESH
          </button>

        </div>

      </div>


      <div class="result-row">

        <div id="productInfo"></div>

        <button
          id="addBtn"
          class="small-button"
          type="button"
        >
          ADD TO RETURN LIST
        </button>

      </div>


      <div class="list-header">

        <span>
          RETURN LIST
        </span>

        <span id="returnTotal">
          RETURN TOTAL: 0.00 ₼
        </span>

      </div>


      <div id="returnList">

        <div id="returnItems"></div>

      </div>


      <div class="actions">

        <button
          id="sendBtn"
          class="action-button"
          type="submit"
        >
          SEND RETURN
        </button>


        <button
          class="action-button"
          type="button"
          onclick="goHome()"
        >
          BACK
        </button>

      </div>


      <div id="message"></div>

    </form>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>DATE</th>
            <th>BARCODE</th>
            <th>ARTICLE</th>
            <th>UNIT</th>
            <th>AMOUNT</th>
          </tr>

        </thead>


        <tbody id="returnData">

          <tr class="empty-row">

            <td colspan="5">
              LOADING...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>



  <script>

    


    let currentProduct = null;

    let returnList = [];


    const dateInput =
      document.getElementById('date');

    const barcodeInput =
      document.getElementById('barcode');

    const searchBtn =
      document.getElementById('searchBtn');

    const refreshBtn =
      document.getElementById('refreshBtn');

    const addBtn =
      document.getElementById('addBtn');

    const productInfo =
      document.getElementById('productInfo');

    const message =
      document.getElementById('message');


    const today =
      new Date();


    dateInput.value =
      new Date(

        today.getTime() -

        today.getTimezoneOffset() *
        60000

      )
      .toISOString()
      .split('T')[0];



    function loadProduct(data) {

      searchBtn.disabled =
        false;

      searchBtn.textContent =
        'SEARCH';


      if (!data) {

        currentProduct =
          null;

        productInfo.style.display =
          'flex';

        productInfo.style.background =
          'transparent';

        productInfo.style.color =
          'red';

        productInfo.style.border =
          'none';

        productInfo.style.fontWeight =
          '400';

        productInfo.textContent =
          'BARCODE NOT FOUND';

        addBtn.style.display =
          'none';

        return;

      }


      currentProduct =
        data;


      productInfo.style.display =
        'flex';

      productInfo.style.background =
        '#ffffff';

      productInfo.style.color =
        '#000000';

      productInfo.style.border =
        '1px solid #000000';

      productInfo.style.fontWeight =
        '400';

      productInfo.textContent =
        data.article;


      addBtn.style.display =
        'block';

    }



    function lookupError() {

      searchBtn.disabled =
        false;

      searchBtn.textContent =
        'SEARCH';

      currentProduct =
        null;

      productInfo.style.display =
        'flex';

      productInfo.style.background =
        'transparent';

      productInfo.style.color =
        'red';

      productInfo.style.border =
        'none';

      productInfo.style.fontWeight =
        '400';

      productInfo.textContent =
        'CONNECTION ERROR';

      addBtn.style.display =
        'none';

    }



    function searchBarcode() {

      const barcode =
        barcodeInput.value.trim();


      if (!barcode) {
        return;
      }


      currentProduct =
        null;


      productInfo.style.display =
        'flex';

      productInfo.style.background =
        'transparent';

      productInfo.style.color =
        '#000000';

      productInfo.style.border =
        'none';

      productInfo.style.fontWeight =
        '400';

      productInfo.textContent =
        'SEARCHING...';


      addBtn.style.display =
        'none';


      searchBtn.disabled =
        true;

      searchBtn.textContent =
        'SEARCHING...';


      CloudAPI.read("product", barcode).then(loadProduct).catch(lookupError);

    }



    function refreshSearch() {

      currentProduct =
        null;


      productInfo.textContent =
        '';

      productInfo.style.display =
        'none';

      productInfo.style.background =
        '#ffffff';

      productInfo.style.color =
        '#000000';

      productInfo.style.border =
        '1px solid #000000';

      productInfo.style.fontWeight =
        '400';


      addBtn.style.display =
        'none';


      barcodeInput.value =
        '';


      searchBtn.disabled =
        false;

      searchBtn.textContent =
        'SEARCH';


      message.textContent =
        '';

      message.className =
        '';

      message.style.display =
        'none';


      barcodeInput.focus();

    }



    function addToReturnList() {

      if (!currentProduct) {
        return;
      }


      const barcode =
        String(
          currentProduct.barcode
        ).trim();


      const existing =
        returnList.find(

          item =>
            item.barcode ===
            barcode

        );


      if (existing) {

        existing.unit += 1;

      } else {

        returnList.push({

          barcode:
            barcode,

          article:
            currentProduct.article,

          unit:
            1,

          amount:
            ''

        });

      }


      renderReturnList();


      barcodeInput.value =
        '';

      productInfo.style.display =
        'none';

      addBtn.style.display =
        'none';

      currentProduct =
        null;

      barcodeInput.focus();

    }



    function renderReturnList() {

      const listBox =
        document.getElementById(
          'returnList'
        );


      const itemsBox =
        document.getElementById(
          'returnItems'
        );


      listBox.style.display =
        returnList.length
          ? 'block'
          : 'none';


      itemsBox.innerHTML =
        '';


      returnList.forEach(
        (item, index) => {


          const row =
            document.createElement(
              'div'
            );


          row.className =
            'return-item';



          const description =
            document.createElement(
              'div'
            );


          description.className =
            'return-description';


          description.textContent =
            item.article;



          const unit =
            document.createElement(
              'input'
            );


          unit.type =
            'number';

          unit.min =
            '1';

          unit.step =
            '1';

          unit.placeholder =
            'UNIT';

          unit.className =
            'unit-input';

          unit.value =
            item.unit;


          unit.addEventListener(
            'input',
            function () {

              returnList[index].unit =
                this.value;

            }
          );



          const amount =
            document.createElement(
              'input'
            );


          amount.type =
            'number';

          amount.min =
            '0.01';

          amount.step =
            '0.01';

          amount.placeholder =
            'AMOUNT';

          amount.className =
            'amount-input';

          amount.value =
            item.amount;


          amount.addEventListener(
            'input',
            function () {

              returnList[index].amount =
                this.value;

              updateTotal();

            }
          );



          const remove =
            document.createElement(
              'button'
            );


          remove.type =
            'button';

          remove.className =
            'remove-button';

          remove.textContent =
            'REMOVE';


          remove.addEventListener(
            'click',
            function () {

              returnList.splice(
                index,
                1
              );

              renderReturnList();

            }
          );


          row.appendChild(
            description
          );

          row.appendChild(
            unit
          );

          row.appendChild(
            amount
          );

          row.appendChild(
            remove
          );


          itemsBox.appendChild(
            row
          );

        }
      );


      updateTotal();

    }



    function updateTotal() {

      const total =
        returnList.reduce(

          (sum, item) =>
            sum +
            (
              Number(
                item.amount
              ) || 0
            ),

          0

        );


      document
        .getElementById(
          'returnTotal'
        )
        .textContent =

          'RETURN TOTAL: ' +

          total.toFixed(2) +

          ' ₼';

    }



    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        type;

    }



    function loadReturns(data) {

      const table =
        document.getElementById(
          'returnData'
        );


      table.innerHTML =
        '';


      if (
        !Array.isArray(data) ||
        !data.length
      ) {

        table.innerHTML =
          '<tr class="empty-row">' +
          '<td colspan="5">' +
          'NO RETURNS' +
          '</td>' +
          '</tr>';

        return;

      }


      data.forEach(
        item => {


          const row =
            document.createElement(
              'tr'
            );


          const rawDate =
            item.date || '';


          const parsedDate =
            new Date(
              rawDate
            );


          const dateText =
            Number.isNaN(
              parsedDate.getTime()
            )

              ? rawDate

              : parsedDate
                .toLocaleDateString(
                  'en-GB'
                );


          const unit =
            item.units !== undefined
              ? item.units
              : item.quantity;


          row.innerHTML =

            '<td>' +
            escapeHtml(
              dateText
            ) +
            '</td>' +

            '<td>' +
            escapeHtml(
              item.barcode || ''
            ) +
            '</td>' +

            '<td>' +
            escapeHtml(
              item.article ||
              item.product ||
              ''
            ) +
            '</td>' +

            '<td>' +
            Number(
              unit
            ) +
            '</td>' +

            '<td>' +
            Number(
              item.amount
            ).toFixed(2) +
            ' ₼' +
            '</td>';


          table.appendChild(
            row
          );

        }
      );

    }



    function addReturnExport() {
      const bar = document.getElementById('cloud-tools');
      if (!bar || document.getElementById('return-excel')) return;
      const button = document.createElement('button');
      button.id = 'return-excel';
      button.type = 'button';
      button.title = 'EXTRACT RETURNS DATA TO EXCEL';
      button.setAttribute('aria-label', button.title);
      button.innerHTML = '<img src="assets/excel-icon-transparent.png" alt="" aria-hidden="true">';
      button.onclick = () => {
        try { exportReturnExcel(); } catch (error) { CloudAPI.showError(error); }
      };
      bar.insertBefore(button, bar.querySelector('.cloud-logout'));
    }

    // Build an XLSX workbook locally. Product labels are always text, never formulas.
    function exportReturnExcel() {
      const xml = value => String(value).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
      const rows = Array.from(document.querySelectorAll('table thead tr, #returnData tr:not(.empty-row)'));
      const quantities = [3];
      const sheetRows = rows.map((row, r) => '<row r="' + (r+1) + '">' + Array.from(row.cells).map((cell, c) => {
        const address = String.fromCharCode(65+c) + (r+1);
        const value = cell.textContent.trim();
        if (r > 0 && c >= 3 && value !== '—' && value !== '') {
          const number = Number(value.replace(/\s|₼/g, ''));
          if (!Number.isFinite(number)) throw new Error('Invalid return value: ' + value);
          return '<c r="'+address+'" s="'+(quantities.includes(c)?1:2)+'"><v>'+number+'</v></c>';
        }
        return '<c r="'+address+'" t="inlineStr"><is><t xml:space="preserve">'+xml(value)+'</t></is></c>';
      }).join('') + '</row>').join('');
      const files = {
        '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
        '_rels/.rels': '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
        'xl/workbook.xml': '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="RETURNS" sheetId="1" r:id="rId1"/></sheets></workbook>',
        'xl/_rels/workbook.xml.rels': '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
        'xl/styles.xml': '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00 &quot;₼&quot;"/></numFmts><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf xfId="0"/><xf xfId="0" numFmtId="1" applyNumberFormat="1"/><xf xfId="0" numFmtId="164" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',
        'xl/worksheets/sheet1.xml': '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="2" width="23" customWidth="1"/><col min="3" max="3" width="48" customWidth="1"/><col min="4" max="5" width="23" customWidth="1"/></cols><sheetData>'+sheetRows+'</sheetData>'+(rows.length>1?'<autoFilter ref="A1:E'+rows.length+'"/>':'')+'</worksheet>'
      };
      const blob = new Blob([returnZip(files)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'RETURNS_' + CloudAPI.today() + '.xlsx';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    // ZIP STORE records with UTF-8 names and CRC-32, sufficient for OOXML packages.
    function returnZip(files) {
      const encoder = new TextEncoder(), chunks = [], directory = [];
      let offset = 0;
      const header = size => {const bytes=new Uint8Array(size); return [bytes,new DataView(bytes.buffer)];};
      for (const [name, content] of Object.entries(files)) {
        const filename=encoder.encode(name), data=encoder.encode(content);
        let crc=0xffffffff;
        for(const byte of data) {crc ^= byte; for(let bit=0;bit<8;bit++) crc=(crc>>>1)^((crc&1)?0xedb88320:0);}
        crc=(crc^0xffffffff)>>>0;
        const [local,l]=header(30);
        l.setUint32(0,0x04034b50,true); l.setUint16(4,20,true); l.setUint16(6,0x800,true); l.setUint16(12,33,true);
        l.setUint32(14,crc,true); l.setUint32(18,data.length,true); l.setUint32(22,data.length,true); l.setUint16(26,filename.length,true);
        chunks.push(local,filename,data);
        const [central,c]=header(46);
        c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x800,true); c.setUint16(14,33,true);
        c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,filename.length,true); c.setUint32(42,offset,true);
        directory.push(central,filename); offset+=local.length+filename.length+data.length;
      }
      const size=directory.reduce((sum,chunk)=>sum+chunk.length,0);
      const [end,e]=header(22); e.setUint32(0,0x06054b50,true); e.setUint16(8,directory.length/2,true); e.setUint16(10,directory.length/2,true); e.setUint32(12,size,true); e.setUint32(16,offset,true);
      const result=new Uint8Array(offset+size+end.length); let position=0;
      for(const chunk of [...chunks,...directory,end]) {result.set(chunk,position);position+=chunk.length;}
      return result;
    }


    function loadReturnHistory() {

      const button = document.getElementById('return-excel');
      if (button) button.disabled = true;
      CloudAPI.read("return").then(data => {
        loadReturns(data);
        addReturnExport();
        document.getElementById('return-excel').disabled = false;
      }).catch(CloudAPI.showError);

    }



    function escapeHtml(value) {

      return String(value)

        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    }



    searchBtn.addEventListener(
      'click',
      searchBarcode
    );


    refreshBtn.addEventListener(
      'click',
      refreshSearch
    );


    addBtn.addEventListener(
      'click',
      addToReturnList
    );


    barcodeInput.addEventListener(
      'keydown',
      function (event) {

        if (event.key === 'Enter') {

          event.preventDefault();

          searchBarcode();

        }

      }
    );



    document
      .getElementById(
        'returnForm'
      )
      .addEventListener(
        'submit',
        function (event) {


          event.preventDefault();


          if (!dateInput.value) {

            showMessage(
              'SET THE DATE',
              'error'
            );

            return;

          }


          if (!returnList.length) {

            showMessage(
              'RETURN LIST EMPTY',
              'error'
            );

            return;

          }


          const invalid =
            returnList.some(

              item =>

                !Number.isInteger(
                  Number(
                    item.unit
                  )
                ) ||

                Number(
                  item.unit
                ) <= 0 ||

                !Number.isFinite(
                  Number(
                    item.amount
                  )
                ) ||

                Number(
                  item.amount
                ) <= 0

            );


          if (invalid) {

            showMessage(
              'ENTER CORRECT UNIT AND AMOUNT',
              'error'
            );

            return;

          }


          const sendBtn =
            document.getElementById(
              'sendBtn'
            );


          sendBtn.disabled =
            true;


          sendBtn.textContent =
            'SENDING...';


          message.style.display =
            'none';


          message.className =
            '';


          const itemsToSend =
            returnList.map(

              item => ({

                barcode:
                  item.barcode,

                article:
                  item.article,

                quantity:
                  -Math.abs(
                    Number(
                      item.unit
                    )
                  ),

                amount:
                  -Math.abs(
                    Number(
                      item.amount
                    )
                  )

              })

            );


          CloudAPI.send(
            {

              method:
                'POST',

              body:
                new URLSearchParams({

                  action:
                    'purchaseList',

                  date:
                    dateInput.value,

                  items:
                    JSON.stringify(
                      itemsToSend
                    )

                })

            }
          )


          .then(
            response =>
              response.text()
          )


          .then(
            result => {


              if (
                result.trim() !==
                'OK'
              ) {

                throw new Error(
                  result
                );

              }


              showMessage(
                'RETURN SENT SUCCESSFULLY!',
                'success'
              );


              returnList =
                [];


              currentProduct =
                null;


              renderReturnList();


              productInfo.style.display =
                'none';


              addBtn.style.display =
                'none';


              barcodeInput.value =
                '';


              barcodeInput.focus();


              loadReturnHistory();

            }
          )


          .catch(
            error => {

              showMessage(
                'ERROR: ' +
                error.message,
                'error'
              );

            }
          )


          .finally(
            () => {

              sendBtn.disabled =
                false;


              sendBtn.textContent =
                'SEND RETURN';

            }
          );

        }
      );



    function goHome() {

      window.location.href =
        'HOME.html';

    }


    loadReturnHistory();

  </script>
