<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>RETURNS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: "Bebas Neue", sans-serif;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    button,
    input,
    textarea,
    select,
    option,
    table {
      font-family: "Bebas Neue", sans-serif;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 28px auto 40px;
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-size: 50px;
      font-weight: 400;
      line-height: 1;
    }

    h2 {
      margin: 42px 0 16px;
      text-align: center;
      font-size: 30px;
      font-weight: 400;
    }

    .return-form {
      border: 1px solid #fff;
      padding: 22px;
    }

    .date-wrap {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }

    .date-box {
      text-align: center;
    }

    .date-input,
    .text-input,
    .unit-input,
    .amount-input {
      height: 46px;
      border: 1px solid #ffc000;
      border-radius: 7px;
      background: #fff;
      color: #000;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
    }

    .date-input {
      width: 168px;
    }

    .date-input,
    .text-input {
      outline: none;
      box-shadow: none;
    }

    .date-input:focus,
    .text-input:focus {
      outline: none;
      box-shadow: none;
    }

    .date-label,
    .field-label {
      font-size: 19px;
      font-weight: 400;
    }

    .field-label {
      margin-bottom: 8px;
    }

    .date-label {
      margin-top: 8px;
    }

    .search-row,
    .result-row {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) 160px;
      gap: 18px;
      max-width: 640px;
      margin-bottom: 18px;
    }

    .text-input {
      width: 100%;
    }

    button {
      border: none;
      border-radius: 7px;
      background: #ffc000;
      color: #000;
      cursor: pointer;
      font-size: 20px;
      font-weight: 400;
    }

    button:hover {
      filter: brightness(0.95);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .small-button {
      height: 46px;
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-actions .small-button {
      flex: 1;
    }

    .clear-search-button {
      display: flex;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      background: transparent;
      color: #8fd14f;
      cursor: pointer;
    }

    .clear-search-button svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .clear-search-button:hover {
      filter: brightness(1.18);
    }

    #productInfo {
      display: none;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      border: 1px solid #ffc000;
      border-radius: 7px;
      padding: 8px 14px;
      background: #fff;
      color: #000;
      text-align: center;
      font-size: 20px;
      font-weight: 400;
      overflow-wrap: anywhere;
    }

    #addBtn {
      display: none;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      margin: 24px 5px 10px;
      font-size: 20px;
      font-weight: 400;
    }

    #returnList {
      display: none;
      min-height: 140px;
      border: 1px solid #ffc000;
      padding: 16px 18px;
    }

    .return-item {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 120px 170px 150px;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }

    .return-description {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .unit-input,
    .amount-input {
      width: 100%;
    }

    .remove-button {
      height: 46px;
      background: red;
      color: #000;
      font-size: 20px;
      font-weight: 400;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .action-button {
      height: 46px;
      font-size: 20px;
      font-weight: 400;
    }

    #message {
      display: none;
      max-width: 500px;
      margin: 30px auto 0;
      padding: 11px 15px;
      border-radius: 7px;
      text-align: center;
      font-size: 21px;
      font-weight: 400;
    }

    .success {
      display: block !important;
      background: transparent;
      color: #8fd14f;
      border: none !important;
      padding: 0 !important;
    }

    .error {
      display: block !important;
      background: transparent;
      color: red;
      border: none !important;
      padding: 0 !important;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
      font-size: 19px;
    }

    th,
    td {
      padding: 10px;
      border: 1px solid #444;
      text-align: center;
      font-weight: 400;
      white-space: nowrap;
    }

    th {
      background: #fff;
      color: #000;
      font-size: 20px;
    }

    .empty-row td {
      padding: 28px;
      color: #aaa;
      font-size: 20px;
    }

    @media (max-width: 760px) {

      .container {
        width: 94%;
        margin: 18px auto 35px;
      }

      h1 {
        font-size: 44px;
      }

      h2 {
        font-size: 28px;
      }

      .return-form {
        padding: 15px;
      }

      .date-wrap {
        justify-content: center;
      }

      .search-row,
      .result-row,
      .return-item,
      .actions {
        grid-template-columns: 1fr;
      }

      .search-row,
      .result-row {
        gap: 10px;
        max-width: none;
      }

      .return-item {
        gap: 10px;
        border-bottom: 1px solid #333;
        padding-bottom: 14px;
      }

      .actions {
        gap: 10px;
      }

      .list-header {
        font-size: 19px;
      }

      button,
      .small-button,
      .action-button,
      .remove-button {
        font-size: 20px;
      }

      table {
        font-size: 18px;
      }

    }

  </style>
</head>


<body>

  <div class="container">

    <h1>RETURNS</h1>


    <form id="returnForm" class="return-form">

      <div class="date-wrap">

        <div class="date-box">

          <input
            id="date"
            class="date-input"
            type="date"
            required
          >

          <div class="date-label">
            SET THE DATE
          </div>

        </div>

      </div>


      <div class="field-label">
        ENTER BARCODE
      </div>


      <div class="search-row">

        <input
          id="barcode"
          class="text-input"
          type="text"
          inputmode="numeric"
          autocomplete="off"
        >


        <div class="search-actions">

          <button
            id="searchBtn"
            class="small-button"
            type="button"
          >
            SEARCH
          </button>


          <button
            id="clearSearchBtn"
            class="clear-search-button"
            type="button"
            aria-label="Clear search message"
          >

            <svg viewBox="0 0 24 24">

              <path d="M20 7V3l-2 2a8 8 0 0 0-13 3"/>

              <path d="M4 17v4l2-2a8 8 0 0 0 13-3"/>

              <path d="M20 3h-4M4 21h4"/>

            </svg>

          </button>

        </div>

      </div>


      <div class="result-row">

        <div id="productInfo"></div>

        <button
          id="addBtn"
          class="small-button"
          type="button"
        >
          ADD TO RETURN LIST
        </button>

      </div>


      <div class="list-header">

        <span>
          RETURN LIST
        </span>

        <span id="returnTotal">
          RETURN TOTAL: 0.00 ₼
        </span>

      </div>


      <div id="returnList">
        <div id="returnItems"></div>
      </div>


      <div class="actions">

        <button
          id="sendBtn"
          class="action-button"
          type="submit"
        >
          SEND RETURN
        </button>


        <button
          class="action-button"
          type="button"
          onclick="goHome()"
        >
          BACK
        </button>

      </div>


      <div id="message"></div>

    </form>


    <h2>RETURN HISTORY</h2>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>DATE</th>
            <th>BARCODE</th>
            <th>ARTICLE</th>
            <th>UNIT</th>
            <th>AMOUNT</th>
          </tr>

        </thead>


        <tbody id="returnData">

          <tr class="empty-row">

            <td colspan="5">
              LOADING...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>



  <script>

    const BACKEND_URL =
      'https://script.google.com/macros/s/AKfycbwjwtmAP5m5LxLk-zBepSD4p_lwSRcNEHnhi9VzX7vV_nCqdi_ryk-fkuRwIH58o2Ld/exec';


    let currentProduct = null;

    let returnList = [];


    const dateInput =
      document.getElementById('date');

    const barcodeInput =
      document.getElementById('barcode');

    const searchBtn =
      document.getElementById('searchBtn');

    const clearSearchBtn =
      document.getElementById('clearSearchBtn');

    const addBtn =
      document.getElementById('addBtn');

    const productInfo =
      document.getElementById('productInfo');

    const message =
      document.getElementById('message');



    const today =
      new Date();


    dateInput.value =
      new Date(

        today.getTime() -

        today.getTimezoneOffset() * 60000

      )
      .toISOString()
      .split('T')[0];



    function loadProduct(data) {

      searchBtn.disabled =
        false;

      searchBtn.textContent =
        'SEARCH';


      if (!data) {

        currentProduct =
          null;


        productInfo.style.display =
          'flex';

        productInfo.style.background =
          'transparent';

        productInfo.style.color =
          'red';

        productInfo.style.border =
          'none';

        productInfo.style.fontWeight =
          '400';

        productInfo.textContent =
          'BARCODE NOT FOUND';


        addBtn.style.display =
          'none';


        return;

      }


      currentProduct =
        data;


      productInfo.style.display =
        'flex';

      productInfo.style.background =
        '#fff';

      productInfo.style.color =
        '#000';

      productInfo.style.border =
        '1px solid #ffc000';

      productInfo.style.fontWeight =
        '400';

      productInfo.textContent =
        data.article;


      addBtn.style.display =
        'block';

    }



    function lookupError() {

      searchBtn.disabled =
        false;

      searchBtn.textContent =
        'SEARCH';


      currentProduct =
        null;


      productInfo.style.display =
        'flex';

      productInfo.style.background =
        'transparent';

      productInfo.style.color =
        'red';

      productInfo.style.border =
        'none';

      productInfo.style.fontWeight =
        '400';

      productInfo.textContent =
        'CONNECTION ERROR';


      addBtn.style.display =
        'none';

    }



    function searchBarcode() {

      const barcode =
        barcodeInput.value.trim();


      if (!barcode) {
        return;
      }


      currentProduct =
        null;


      productInfo.style.display =
        'flex';

      productInfo.style.background =
        'transparent';

      productInfo.style.color =
        '#8fd14f';

      productInfo.style.border =
        'none';

      productInfo.style.fontWeight =
        '400';

      productInfo.textContent =
        'SEARCHING...';


      addBtn.style.display =
        'none';


      searchBtn.disabled =
        true;

      searchBtn.textContent =
        'SEARCHING...';


      const oldScript =
        document.getElementById(
          'productLookup'
        );


      if (oldScript) {
        oldScript.remove();
      }


      const script =
        document.createElement(
          'script'
        );


      script.id =
        'productLookup';


      script.onerror =
        lookupError;


      script.src =
        BACKEND_URL +

        '?action=product&barcode=' +

        encodeURIComponent(
          barcode
        ) +

        '&callback=loadProduct&_=' +

        Date.now();


      document.body.appendChild(
        script
      );

    }



    function clearSearchMessage() {

      currentProduct =
        null;


      productInfo.textContent =
        '';

      productInfo.style.display =
        'none';


      addBtn.style.display =
        'none';


      barcodeInput.value =
        '';


      searchBtn.disabled =
        false;

      searchBtn.textContent =
        'SEARCH';


      barcodeInput.focus();

    }



    function addToReturnList() {

      if (!currentProduct) {
        return;
      }


      const barcode =
        String(
          currentProduct.barcode
        ).trim();


      const existing =
        returnList.find(
          item =>
            item.barcode === barcode
        );


      if (existing) {

        existing.unit += 1;

      } else {

        returnList.push({

          barcode:
            barcode,

          article:
            currentProduct.article,

          unit:
            1,

          amount:
            ''

        });

      }


      renderReturnList();


      barcodeInput.value =
        '';

      productInfo.style.display =
        'none';

      addBtn.style.display =
        'none';


      currentProduct =
        null;


      barcodeInput.focus();

    }



    function renderReturnList() {

      const listBox =
        document.getElementById(
          'returnList'
        );


      const itemsBox =
        document.getElementById(
          'returnItems'
        );


      listBox.style.display =
        returnList.length
          ? 'block'
          : 'none';


      itemsBox.innerHTML =
        '';


      returnList.forEach(
        (item, index) => {


          const row =
            document.createElement(
              'div'
            );


          row.className =
            'return-item';



          const description =
            document.createElement(
              'div'
            );


          description.className =
            'return-description';


          description.textContent =
            item.article;



          const unit =
            document.createElement(
              'input'
            );


          unit.type =
            'number';

          unit.min =
            '1';

          unit.step =
            '1';

          unit.placeholder =
            'UNIT';

          unit.className =
            'unit-input';

          unit.value =
            item.unit;


          unit.addEventListener(
            'input',
            function () {

              returnList[index].unit =
                this.value;

            }
          );



          const amount =
            document.createElement(
              'input'
            );


          amount.type =
            'number';

          amount.min =
            '0.01';

          amount.step =
            '0.01';

          amount.placeholder =
            'AMOUNT';

          amount.className =
            'amount-input';

          amount.value =
            item.amount;


          amount.addEventListener(
            'input',
            function () {

              returnList[index].amount =
                this.value;

              updateTotal();

            }
          );



          const remove =
            document.createElement(
              'button'
            );


          remove.type =
            'button';

          remove.className =
            'remove-button';

          remove.textContent =
            'REMOVE';


          remove.addEventListener(
            'click',
            function () {

              returnList.splice(
                index,
                1
              );


              renderReturnList();

            }
          );


          row.appendChild(
            description
          );

          row.appendChild(
            unit
          );

          row.appendChild(
            amount
          );

          row.appendChild(
            remove
          );


          itemsBox.appendChild(
            row
          );

        }
      );


      updateTotal();

    }



    function updateTotal() {

      const total =
        returnList.reduce(

          (sum, item) =>
            sum +
            (
              Number(item.amount)
              || 0
            ),

          0

        );


      document
        .getElementById(
          'returnTotal'
        )
        .textContent =

          'RETURN TOTAL: ' +
          total.toFixed(2) +
          ' ₼';

    }



    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        type;

    }



    function loadReturns(data) {

      const table =
        document.getElementById(
          'returnData'
        );


      table.innerHTML =
        '';


      if (
        !Array.isArray(data) ||
        !data.length
      ) {

        table.innerHTML =
          '<tr class="empty-row">' +
          '<td colspan="5">' +
          'NO RETURNS' +
          '</td>' +
          '</tr>';


        return;

      }


      data.forEach(
        item => {


          const row =
            document.createElement(
              'tr'
            );


          const rawDate =
            item.date || '';


          const parsedDate =
            new Date(
              rawDate
            );


          const dateText =
            Number.isNaN(
              parsedDate.getTime()
            )
              ? rawDate
              : parsedDate
                  .toLocaleDateString(
                    'en-GB'
                  );


          const unit =
            item.units !== undefined
              ? item.units
              : item.quantity;


          row.innerHTML =

            '<td>' +
            escapeHtml(
              dateText
            ) +
            '</td>' +


            '<td>' +
            escapeHtml(
              item.barcode || ''
            ) +
            '</td>' +


            '<td>' +
            escapeHtml(
              item.article ||
              item.product ||
              ''
            ) +
            '</td>' +


            '<td>' +
            Number(
              unit
            ) +
            '</td>' +


            '<td>' +
            Number(
              item.amount
            ).toFixed(2) +
            ' ₼' +
            '</td>';


          table.appendChild(
            row
          );

        }
      );

    }



    function loadReturnHistory() {

      const oldScript =
        document.getElementById(
          'returnHistory'
        );


      if (oldScript) {
        oldScript.remove();
      }


      const script =
        document.createElement(
          'script'
        );


      script.id =
        'returnHistory';


      script.src =
        BACKEND_URL +

        '?action=return' +

        '&callback=loadReturns' +

        '&_=' +

        Date.now();


      document.body.appendChild(
        script
      );

    }



    function escapeHtml(value) {

      return String(value)

        .replaceAll(
          '&',
          '&amp;'
        )

        .replaceAll(
          '<',
          '&lt;'
        )

        .replaceAll(
          '>',
          '&gt;'
        )

        .replaceAll(
          '"',
          '&quot;'
        )

        .replaceAll(
          "'",
          '&#039;'
        );

    }



    searchBtn.addEventListener(
      'click',
      searchBarcode
    );



    clearSearchBtn.addEventListener(
      'click',
      clearSearchMessage
    );



    addBtn.addEventListener(
      'click',
      addToReturnList
    );



    barcodeInput.addEventListener(
      'keydown',
      function (event) {

        if (
          event.key === 'Enter'
        ) {

          event.preventDefault();

          searchBarcode();

        }

      }
    );



    document
      .getElementById(
        'returnForm'
      )
      .addEventListener(
        'submit',
        function (event) {


          event.preventDefault();


          if (
            !dateInput.value
          ) {

            showMessage(
              'SET THE DATE',
              'error'
            );


            return;

          }


          if (
            !returnList.length
          ) {

            showMessage(
              'RETURN LIST EMPTY',
              'error'
            );


            return;

          }


          const invalid =
            returnList.some(

              item =>

                !Number.isInteger(
                  Number(
                    item.unit
                  )
                ) ||

                Number(
                  item.unit
                ) <= 0 ||

                !Number.isFinite(
                  Number(
                    item.amount
                  )
                ) ||

                Number(
                  item.amount
                ) <= 0

            );


          if (
            invalid
          ) {

            showMessage(
              'ENTER CORRECT UNIT AND AMOUNT',
              'error'
            );


            return;

          }


          const sendBtn =
            document.getElementById(
              'sendBtn'
            );


          sendBtn.disabled =
            true;


          sendBtn.textContent =
            'SENDING...';


          message.style.display =
            'none';


          message.className =
            '';


          const itemsToSend =
            returnList.map(

              item => ({

                barcode:
                  item.barcode,

                article:
                  item.article,


                quantity:
                  -Math.abs(
                    Number(
                      item.unit
                    )
                  ),


                amount:
                  -Math.abs(
                    Number(
                      item.amount
                    )
                  )

              })

            );


          fetch(
            BACKEND_URL,
            {

              method:
                'POST',


              body:
                new URLSearchParams({

                  action:
                    'purchaseList',

                  date:
                    dateInput.value,


                  items:
                    JSON.stringify(
                      itemsToSend
                    )

                })

            }
          )


          .then(
            response =>
              response.text()
          )


          .then(
            result => {


              if (
                result.trim()
                !== 'OK'
              ) {

                throw new Error(
                  result
                );

              }


              showMessage(
                'RETURN SENT SUCCESSFULLY!',
                'success'
              );


              returnList =
                [];


              currentProduct =
                null;


              renderReturnList();


              productInfo.style.display =
                'none';


              addBtn.style.display =
                'none';


              barcodeInput.value =
                '';


              barcodeInput.focus();


              loadReturnHistory();

            }
          )


          .catch(
            error => {

              showMessage(
                'ERROR: ' +
                error.message,
                'error'
              );

            }
          )


          .finally(
            () => {

              sendBtn.disabled =
                false;


              sendBtn.textContent =
                'SEND RETURN';

            }
          );

        }
      );



    function goHome() {

      window.location.href =
        'HOME.html';

    }



    loadReturnHistory();

  </script>

</body>

</html>
